# Calendar reminder written to the run log. Use an agent/MCP step only after
# discovering and authorizing the desired notification provider.
version: 1
name: replace-with-reminder-name
enabled: false
trust: safe
concurrency:
  key: weekday-reminder
  policy: skip
triggers:
  - every:
      cron: "0 9 * * 1-5"
      timezone: Asia/Jakarta
missed: skip_missed
jobs:
  reminder:
    name: Weekday reminder
    timeout: 1m
    steps:
      - name: Write reminder
        run: |
          printf '%s\n' 'NusaShell reminder: replace this message'
