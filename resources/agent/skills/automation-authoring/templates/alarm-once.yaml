# One-shot local alarm. Replace `at` with a future RFC3339 time and timezone.
version: 1
name: replace-with-alarm-name
enabled: false
trust: safe
triggers:
  - once:
      at: "2026-12-31T07:00:00+07:00"
      timezone: Asia/Jakarta
missed: skip_missed
jobs:
  alarm:
    name: Local alarm
    timeout: 1m
    steps:
      - name: Emit a terminal bell and log message
        run: |
          printf '\a%s\n' 'NusaShell alarm: replace this message'
