<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>NusaShell Files</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="files-shell">
    <header class="files-topbar">
      <div class="files-brand">
        <span class="files-brand-mark" aria-hidden="true">📂</span>
        <div>
          <strong>Files</strong>
          <span id="root-caption">—</span>
        </div>
      </div>

      <form class="files-search" id="search-form" role="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="search-input" type="search" maxlength="500" placeholder="Search by file name…" aria-label="Search files">
        <kbd>Enter</kbd>
      </form>

      <div class="topbar-actions">
        <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh directory" title="Refresh directory">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6v5h-5"></path><path d="M19 11a7 7 0 1 0 1 5"></path></svg>
        </button>
        <button class="icon-button" id="up-button" type="button" aria-label="Go to parent directory" title="Go up">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
        </button>
        <button class="primary-button compact" id="new-file-button" type="button">
          <span aria-hidden="true">＋</span> New file
        </button>
      </div>
    </header>

    <main class="files-workspace">
      <aside class="sidebar-tree" aria-label="Directory tree">
        <div class="sidebar-heading">
          <span>Tree</span>
          <button class="icon-button small" id="collapse-tree-button" type="button" aria-label="Collapse all" title="Collapse all">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 15 5-5 5 5"></path></svg>
          </button>
        </div>
        <nav class="tree-container" id="tree-container" aria-label="Directory tree navigation">
          <p class="tree-empty">Loading tree…</p>
        </nav>
      </aside>

      <section class="files-main" aria-label="File listing">
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Current path"></nav>

        <div class="listing-header">
          <span class="listing-count" id="listing-count">—</span>
          <div class="listing-actions">
            <button class="secondary-button small" id="new-folder-button" type="button">
              <span aria-hidden="true">📁</span> New folder
            </button>
            <button class="secondary-button small" id="rename-button" type="button" disabled>
              Rename
            </button>
            <button class="danger-button small" id="delete-button" type="button" disabled>
              Delete
            </button>
          </div>
        </div>

        <div class="listing-body" id="listing-body" role="list">
          <p class="listing-empty">Loading…</p>
        </div>
      </section>

      <section class="preview-pane" id="preview-pane" aria-label="File preview" hidden>
        <div class="preview-header">
          <strong id="preview-title">—</strong>
          <button class="icon-button" id="close-preview-button" type="button" aria-label="Close preview">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
        <div class="preview-meta" id="preview-meta"></div>
        <div class="preview-content" id="preview-content"></div>
      </section>
    </main>

    <div class="modal-overlay" id="modal-overlay" hidden>
      <section class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <strong id="modal-title">—</strong>
          <button class="icon-button" id="modal-close-button" type="button" aria-label="Close dialog">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </header>
        <form class="modal-form" id="modal-form">
          <label class="form-field">
            <span id="modal-field-label">Name</span>
            <input id="modal-input" type="text" autocomplete="off" required>
          </label>
          <label class="form-field" id="modal-content-field" hidden>
            <span>Content</span>
            <textarea id="modal-textarea" rows="10"></textarea>
          </label>
          <span class="form-error" id="modal-error" role="alert"></span>
          <div class="modal-actions">
            <button class="secondary-button" id="modal-cancel-button" type="button">Cancel</button>
            <button class="primary-button" id="modal-save-button" type="submit">Save</button>
          </div>
        </form>
      </section>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
