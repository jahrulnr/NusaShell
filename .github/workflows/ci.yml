name: Test and build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: "24"
  PNPM_VERSION: "11.17.0"

jobs:
  test-frontend:
    name: Frontend test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Electron binary
        # --ignore-scripts skips Electron's postinstall (binary download) and
        # the desktop electron-rebuild postinstall. Tray tests need the Electron
        # binary, so run its install explicitly. electron-rebuild is skipped —
        # better-sqlite3 N-API prebuilds are ABI-stable across Node/Electron.
        run: node node_modules/electron/install.js

      - name: Run frontend tests
        run: pnpm test:frontend

  test-backend:
    name: Backend test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run backend tests
        run: pnpm test:backend

  build:
    name: Build (${{ matrix.platform }})
    needs: [test-frontend, test-backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build desktop distributable
        run: pnpm desktop:make

      - name: Package Linux directory install artifact
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p apps/desktop/out/release
          tar -C apps/desktop/out -czf "apps/desktop/out/release/nusashell-${version}-linux-x64.tar.gz" NusaShell-linux-x64
          sha256sum "apps/desktop/out/release/nusashell-${version}-linux-x64.tar.gz" > "apps/desktop/out/release/nusashell-${version}-linux-x64.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nusashell-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            apps/desktop/out/make/**/*
            apps/desktop/out/release/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Release only on pushes to master (includes merged PRs). Pull requests and
  # workflow_dispatch stop after the build job and upload workflow artifacts.
  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nusashell-*
          path: release-artifacts
          merge-multiple: true

      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — skipping (bump VERSION to publish a new release)."
            exit 0
          fi
          payload="$(find release-artifacts -type f -name "nusashell-${version}-linux-x64.tar.gz" -print -quit)"
          if [[ -z "${payload}" ]]; then
            echo "Missing Linux directory-install payload" >&2
            exit 1
          fi
          payload_name="$(basename "${payload}")"
          payload_sha="$(sha256sum "${payload}" | awk '{print $1}')"
          printf '{"version":"%s","files":{"linux-x64":{"name":"%s","sha256":"%s"}}}\n' \
            "${version}" "${payload_name}" "${payload_sha}" > release-artifacts/latest.json
          node scripts/release-notes.mjs "${version}" CHANGELOG.md > release-notes.md
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          gh release create "${tag}" "${artifacts[@]}" \
            --target "${GITHUB_SHA}" \
            --title "NusaShell ${tag}" \
            --notes-file release-notes.md
