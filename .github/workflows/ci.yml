name: Test and build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: "24"

jobs:
  detect-changes:
    name: Detect changed release streams
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go_changed: ${{ steps.detect.outputs.go_changed }}
      electron_changed: ${{ steps.detect.outputs.electron_changed }}
      pets_changed: ${{ steps.detect.outputs.pets_changed }}
      has_release_changes: ${{ steps.detect.outputs.has_release_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect changed streams
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          files=''
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/release-changes.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              files="$(git diff --name-only "$before..$after")"
            else
              files="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            fi
          fi

          go_version="$(node scripts/version.mjs read-go)"
          electron_version="$(node scripts/version.mjs read)"
          pets_version="$(node scripts/version.mjs read-pets)"
          GO_VERSION="$go_version" ELECTRON_VERSION="$electron_version" PETS_VERSION="$pets_version" \
            node scripts/release-changes.mjs --release-index release-versions.json <<< "$files" >> "$GITHUB_OUTPUT"

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node --test frontend/tests/*.test.mjs

  test-electron:
    name: Electron wrapper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json
      - run: node scripts/version.mjs check
      - run: npm ci --prefix apps/electron
      - run: npm --prefix apps/electron test

  test-pets:
    name: Pets tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/pets/go.mod
          check-latest: true
          cache: true
      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(cd apps/pets && gofmt -l .)"
          test -z "$unformatted"
      - run: cd apps/pets && go vet ./...
      - run: cd apps/pets && go test ./...

  test-installers:
    name: Installer scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run installer and release contract tests
        run: node --test scripts/version.test.mjs scripts/release-changes.test.mjs scripts/release-index.test.mjs scripts/release-manifest.test.mjs scripts/release-notes.test.mjs scripts/release-workflow.test.mjs scripts/install.test.mjs
      - name: Check Bash installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/install.sh scripts/install-local.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('scripts/install.ps1', 'scripts/install-local.ps1')) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $path -Raw))
          }

  test-electron-ui:
    name: Electron renderer smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb
      - name: Stage native Go backend for the wrapper smoke test
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p apps/electron/runtime
          go build -buildvcs=false -ldflags "-X main.version=${version}" -o apps/electron/runtime/nusashell ./cmd/nusashell
      - run: npm ci --prefix apps/electron
      - run: npm --prefix apps/electron run test:ui

  test-backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(find . \
            -path './.git' -prune -o \
            -path './.experimental' -prune -o \
            -type f -name '*.go' -exec gofmt -l {} +)"
          test -z "$unformatted"
      - name: Verify UI docs are fresh
        shell: bash
        run: go run ./cmd/scan-ui-docs -check
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build (${{ matrix.os }})
    needs: [test-frontend, test-backend, test-electron, test-pets, test-installers, test-electron-ui]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Regenerate UI docs
        shell: bash
        run: go run ./cmd/scan-ui-docs
      - name: Regenerate catalog
        shell: bash
        run: go run ./cmd/gen-catalog
      - name: Build Go packages with release version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          go build -buildvcs=false -ldflags "-X main.version=${version}" ./...

  # Go core and Electron wrapper are independent release streams. The wrapper
  # never receives a Go binary in its package. Product-specific test gates are
  # intentionally kept out of the other stream's needs list, so a failing Go
  # test cannot suppress an otherwise healthy Electron release (and vice versa).
  # The Linux-only pets stream (apps/pets) follows the same independent pattern.
  build-go-release:
    name: Go release (${{ matrix.os }})
    needs: [detect-changes, test-frontend, test-backend, test-installers]
    if: needs.detect-changes.outputs.go_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Regenerate embedded documentation and catalog
        shell: bash
        run: |
          go run ./cmd/scan-ui-docs
          go run ./cmd/gen-catalog
      - name: Verify Go release version metadata
        shell: bash
        run: node scripts/version.mjs read-go
      - name: Build and package Go core
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p release/go/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -buildvcs=false -ldflags "-X main.version=${version}" -o release/go/stage/nusashell.exe ./cmd/nusashell
            powershell -NoProfile -Command "Compress-Archive -Path 'release/go/stage/nusashell.exe' -DestinationPath 'release/go/nusashell-${version}-win-x64.zip' -Force"
          else
            go build -buildvcs=false -ldflags "-X main.version=${version}" -o release/go/stage/nusashell ./cmd/nusashell
            tar -C release/go/stage -czf "release/go/nusashell-${version}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" nusashell
          fi
          for payload in release/go/*.tar.gz release/go/*.zip; do
            [ -f "$payload" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$payload" > "$payload.sha256"
            else
              shasum -a 256 "$payload" > "$payload.sha256"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nusashell-go-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/go/**
          if-no-files-found: error

  build-electron:
    name: Electron wrapper release (${{ matrix.os }})
    needs: [detect-changes, test-electron, test-electron-ui, test-installers]
    if: needs.detect-changes.outputs.electron_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-14
            platform: mac
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json
      - name: Verify release version metadata
        shell: bash
        run: node scripts/version.mjs check
      - run: npm ci --prefix apps/electron
      - name: Build Electron wrapper artifacts
        shell: bash
        run: npm --prefix apps/electron run dist -- --publish never
      - name: Package Linux directory wrapper payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < apps/electron/VERSION)"
          npm --prefix apps/electron run package:dir
          mkdir -p release/electron
          tar -C apps/electron/dist/linux-unpacked -czf "$GITHUB_WORKSPACE/release/electron/nusashell-electron-${version}-linux-x64.tar.gz" .
          sha256sum "release/electron/nusashell-electron-${version}-linux-x64.tar.gz" > "release/electron/nusashell-electron-${version}-linux-x64.tar.gz.sha256"
      - name: Collect native Electron artifacts
        shell: bash
        run: |
          mkdir -p release/electron
          find apps/electron/dist -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release/electron/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: nusashell-electron-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/electron/**
          if-no-files-found: error

  build-pets-release:
    name: Pets release (${{ matrix.os }})
    needs: [detect-changes, test-pets, test-installers]
    if: needs.detect-changes.outputs.pets_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/pets/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: apps/pets/go.sum
      - name: Install SDL2 and X11 development headers
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsdl2-dev libx11-dev libxext-dev pkg-config
      - name: Build and package pets
        shell: bash
        run: |
          set -euo pipefail
          cd apps/pets
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p "$GITHUB_WORKSPACE/release/pets/stage"
          go build -buildvcs=false -tags sdl2 -o "$GITHUB_WORKSPACE/release/pets/stage/nusashell-pets" ./cmd/pets
          cp -R assets "$GITHUB_WORKSPACE/release/pets/stage/"
          tar -C "$GITHUB_WORKSPACE/release/pets/stage" -czf "$GITHUB_WORKSPACE/release/pets/nusashell-pets-${version}-linux-${{ matrix.arch }}.tar.gz" nusashell-pets assets
          sha256sum "$GITHUB_WORKSPACE/release/pets/nusashell-pets-${version}-linux-${{ matrix.arch }}.tar.gz" > "$GITHUB_WORKSPACE/release/pets/nusashell-pets-${version}-linux-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nusashell-pets-linux-${{ matrix.arch }}
          path: release/pets/**
          if-no-files-found: error

  publish-go:
    name: Publish Go GitHub release
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.create_release.outcome == 'success' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.go_changed == 'true'
    needs: [detect-changes, build-go-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read Go release version
        id: release
        shell: bash
        run: |
          version="$(node scripts/version.mjs read-go)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=go-v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: nusashell-go-*
          path: release-artifacts/go
          merge-multiple: true
      - name: Check Go release tag does not already exist
        id: tag_check
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$TAG" || git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists. Skipping Go release; bump VERSION before merging another Go release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Go release manifest
        if: steps.tag_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          node scripts/release-manifest.mjs "$version" release-artifacts/go release-artifacts/latest.json go
          if ! node scripts/release-notes.mjs "$version" CHANGELOG.md > release-notes.md; then
            printf 'NusaShell Go core %s\n\nBuilt from commit %s.\n' "$version" "$GITHUB_SHA" > release-notes.md
          fi
      - name: Create Go GitHub release
        id: create_release
        if: steps.tag_check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find release-artifacts/go -type f -print0)
          artifacts+=(release-artifacts/latest.json)
          gh release create "$TAG" "${artifacts[@]}" \
            --target "${GITHUB_SHA}" \
            --title "NusaShell Go ${TAG#go-}" \
            --notes-file release-notes.md

  publish-electron:
    name: Publish Electron GitHub release
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.create_release.outcome == 'success' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.electron_changed == 'true'
    needs: [detect-changes, build-electron]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read Electron release version
        id: release
        shell: bash
        run: |
          version="$(node scripts/version.mjs read)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=electron-v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: nusashell-electron-*
          path: release-artifacts/electron
          merge-multiple: true
      - name: Check Electron release tag does not already exist
        id: tag_check
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$TAG" || git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists. Skipping Electron release; bump apps/electron/VERSION before merging another Electron release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Electron release manifest
        if: steps.tag_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          node scripts/release-manifest.mjs "$version" release-artifacts/electron release-artifacts/electron-latest.json electron
          if ! node scripts/release-notes.mjs "$version" CHANGELOG.md > release-notes.md; then
            printf 'NusaShell Electron wrapper %s\n\nBuilt from commit %s.\n' "$version" "$GITHUB_SHA" > release-notes.md
          fi
      - name: Create Electron GitHub release
        id: create_release
        if: steps.tag_check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find release-artifacts/electron -type f -print0)
          artifacts+=(release-artifacts/electron-latest.json)
          gh release create "$TAG" "${artifacts[@]}" \
            --target "${GITHUB_SHA}" \
            --title "NusaShell Electron ${TAG#electron-}" \
            --notes-file release-notes.md

  publish-pets:
    name: Publish pets GitHub release
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.create_release.outcome == 'success' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.pets_changed == 'true'
    needs: [detect-changes, build-pets-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read pets release version
        id: release
        shell: bash
        run: |
          version="$(node scripts/version.mjs read-pets)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=pets-v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: nusashell-pets-*
          path: release-artifacts/pets
          merge-multiple: true
      - name: Check pets release tag does not already exist
        id: tag_check
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$TAG" || git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists. Skipping pets release; bump apps/pets/VERSION before merging another pets release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create pets release manifest
        if: steps.tag_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          node scripts/release-manifest.mjs "$version" release-artifacts/pets release-artifacts/pets-latest.json pets
          if ! node scripts/release-notes.mjs "$version" CHANGELOG.md > release-notes.md; then
            printf 'NusaShell pets %s\n\nBuilt from commit %s.\n' "$version" "$GITHUB_SHA" > release-notes.md
          fi
      - name: Create pets GitHub release
        id: create_release
        if: steps.tag_check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find release-artifacts/pets -type f -print0)
          artifacts+=(release-artifacts/pets-latest.json)
          gh release create "$TAG" "${artifacts[@]}" \
            --target "${GITHUB_SHA}" \
            --title "NusaShell Pets ${TAG#pets-}" \
            --notes-file release-notes.md

  publish-release-index:
    name: Update release stream index
    # A partial release is valid: update the pointer for each publisher that
    # succeeded and leave an unpublished/skipped stream pending for a later push.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.has_release_changes == 'true' &&
      (needs.publish-go.outputs.published == 'true' || needs.publish-electron.outputs.published == 'true' || needs.publish-pets.outputs.published == 'true')
    needs: [detect-changes, publish-go, publish-electron, publish-pets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update stream pointers
        env:
          GO_CHANGED: ${{ needs.publish-go.outputs.published == 'true' }}
          ELECTRON_CHANGED: ${{ needs.publish-electron.outputs.published == 'true' }}
          PETS_CHANGED: ${{ needs.publish-pets.outputs.published == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin master
          GO_CHANGED="$GO_CHANGED" ELECTRON_CHANGED="$ELECTRON_CHANGED" PETS_CHANGED="$PETS_CHANGED" \
            GO_VERSION="${{ needs.publish-go.outputs.version }}" \
            ELECTRON_VERSION="${{ needs.publish-electron.outputs.version }}" \
            PETS_VERSION="${{ needs.publish-pets.outputs.version }}" \
            node scripts/release-index.mjs update-from-env release-versions.json
          if git diff --quiet -- release-versions.json; then
            echo 'release-versions.json is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add release-versions.json
