<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Notes Plugin</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px; font-family: -apple-system, "Segoe UI", sans-serif;
    background: #14181f; color: #e6e9ef; height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column;
  }
  h2 { margin: 0 0 12px; font-size: 16px; color: #9fb3ff; }
  textarea {
    width: 100%; box-sizing: border-box; background: #1d2330; color: #e6e9ef;
    border: 1px solid #2c3550; border-radius: 8px; padding: 10px; font-size: 14px;
    resize: none; height: 60px; font-family: inherit;
  }
  button {
    margin-top: 8px; background: #4c6fff; color: white; border: none;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #3d5ce6; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 11px; color: #7d8aa8; margin-top: 6px; min-height: 14px; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; overflow-y: auto; flex: 1; }
  li {
    background: #1d2330; border: 1px solid #2c3550; border-radius: 8px;
    padding: 10px; margin-bottom: 8px; font-size: 13px;
  }
  li .meta { font-size: 10px; color: #7d8aa8; margin-top: 4px; }
</style>
</head>
<body>
  <h2>📝 Notes - MCP tool call demo</h2>
  <textarea id="text" placeholder="Write a note..."></textarea>
  <button id="createBtn">Create Note (calls MCP tool)</button>
  <div id="status"></div>
  <ul id="list"></ul>

<script>
  // --- Bridge helper: talk to the shell via postMessage ---
  // The shell is the parent window that embeds this iframe.
  const pending = new Map();

  function callTool(tool, args) {
    const requestId = Math.random().toString(36).slice(2);
    return new Promise((resolve, reject) => {
      pending.set(requestId, { resolve, reject });
      window.parent.postMessage({ type: "tool_call", tool, args, requestId }, "*");
    });
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.type !== "tool_result") return;
    const p = pending.get(msg.requestId);
    if (!p) return;
    pending.delete(msg.requestId);
    if (msg.error) p.reject(new Error(msg.error));
    else p.resolve(msg.result);
  });

  // --- UI logic ---
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");
  const btn = document.getElementById("createBtn");
  const textarea = document.getElementById("text");

  function renderNotes(notes) {
    listEl.innerHTML = notes.slice().reverse().map(n => `
      <li>${escapeHtml(n.text)}<div class="meta">#${n.id} · ${new Date(n.createdAt).toLocaleTimeString()}</div></li>
    `).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  async function refreshList() {
    const res = await callTool("listNotes", {});
    renderNotes(res.notes);
  }

  btn.addEventListener("click", async () => {
    const text = textarea.value.trim();
    if (!text) return;
    btn.disabled = true;
    statusEl.textContent = "Calling MCP tool createNote() via shell bridge...";
    try {
      const res = await callTool("createNote", { text });
      statusEl.textContent = `✓ Note #${res.note.id} created. Total notes: ${res.totalNotes}`;
      textarea.value = "";
      await refreshList();
    } catch (err) {
      statusEl.textContent = "✗ Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  // load existing notes on open
  refreshList().catch(() => {});
</script>
</body>
</html>
