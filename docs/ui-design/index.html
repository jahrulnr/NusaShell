<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shell - AI Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window">

  <!-- ===== Title bar ===== -->
  <div class="titlebar">
    <div class="brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <rect width="24" height="24" rx="6" fill="#3b6ef0"/>
          <path d="M8 8L16 16M16 8L8 16" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      Shell
    </div>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Search apps..." />
    </div>

    <div class="titlebar-spacer"></div>

    <div class="top-actions">
      <button class="icon-btn" aria-label="Mail">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="dot dot-red">3</span>
      </button>
      <button class="icon-btn" aria-label="Messages">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="dot dot-green">1</span>
      </button>
      <button class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.4a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 17.76a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 13a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 7a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 3.13 1.7 1.7 0 0 0 10 1.6V1.51a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 3.13a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.36 7a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="avatar">JR</div>
    </div>
  </div>

  <!-- ===== Body: sidebar + content ===== -->
  <div class="body">

    <aside class="sidebar">
      <nav class="nav-main">
        <a class="nav-item active" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M3 11l9-8 9 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h14V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Home
        </a>
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg>
          Installed Apps
        </a>
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Running
        </a>
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 12a8 8 0 0 1 14-5.2M20 12a8 8 0 0 1-14 5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M18 3v4h-4M6 21v-4h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Updates
          <span class="nav-badge">2</span>
        </a>
      </nav>

      <div class="nav-section-label">Categories</div>
      <nav class="nav-categories">
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Productivity
        </a>
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-4.7 7.6 8.38 8.38 0 0 1-3.8.9 8.5 8.5 0 0 1-4-1L3 21l1.5-4.5a8.38 8.38 0 0 1-1-4 8.5 8.5 0 0 1 8.5-8.5 8.48 8.48 0 0 1 8.5 8.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          Communication
        </a>
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87 2 2 0 1 1-2.83 2.83 1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55 2 2 0 1 1-4 0 1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34 2 2 0 1 1-2.83-2.83A1.7 1.7 0 0 0 4.6 13a1.7 1.7 0 0 0-1.55-1 2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87 2 2 0 1 1 2.83-2.83A1.7 1.7 0 0 0 9 3.13 1.7 1.7 0 0 0 10 1.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34 2 2 0 1 1 2.83 2.83A1.7 1.7 0 0 0 19.36 7a1.7 1.7 0 0 0 1.55 1 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.1"/></svg>
          Utilities
        </a>
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M8 9l-5 3 5 3M16 9l5 3-5 3M13 6l-2 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Developer
        </a>
        <a class="nav-item" data-nav>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M19 15l.8 2.4L22 18l-2.2.6L19 21l-.8-2.4L16 18l2.2-.6L19 15z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          AI Tools
        </a>
      </nav>

      <div class="storage">
        <div class="storage-row">
          <span>Storage</span>
          <span class="storage-text">6.2 GB / 20 GB</span>
        </div>
        <div class="storage-bar"><div class="storage-fill"></div></div>
      </div>
    </aside>

    <main class="content">

      <div class="greeting-row">
        <div>
          <h1 class="greeting">Good evening, Jahrul <span class="wave">👋</span></h1>
          <p class="subtitle">Everything you need, in one shell.</p>
        </div>
      </div>

      <div class="filter-row">
        <div class="tabs">
          <button class="tab active" data-tab>All Apps</button>
          <button class="tab" data-tab>Productivity</button>
          <button class="tab" data-tab>Communication</button>
          <button class="tab" data-tab>Utilities</button>
          <button class="tab" data-tab>AI Tools</button>
          <button class="tab tab-add" data-tab aria-label="Add category">+</button>
        </div>
        <button class="customize-btn">Customize Desktop</button>
      </div>

      <div class="app-grid">

        <button class="app-cell" data-app>
          <div class="app-icon bg-white">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" fill="#eef2ff" stroke="#3b6ef0" stroke-width="1.6"/><path d="M3 7l9 6 9-6" stroke="#3b6ef0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="app-name">Email</div>
          <div class="app-status running"><span class="status-dot"></span>Running</div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-white">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.6-4.1A8 8 0 1 1 20 11.5z" fill="#e7fbef" stroke="#2fbf71" stroke-width="1.6" stroke-linejoin="round"/><circle cx="9" cy="11.5" r="1.1" fill="#2fbf71"/><circle cx="12.3" cy="11.5" r="1.1" fill="#2fbf71"/><circle cx="15.6" cy="11.5" r="1.1" fill="#2fbf71"/></svg>
          </div>
          <div class="app-name">WhatsApp</div>
          <div class="app-status running"><span class="status-dot"></span>Running</div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-white">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" fill="#fff8e1" stroke="#e8b923" stroke-width="1.6"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4.5" stroke="#e8b923" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <div class="app-name">Notes</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-blue">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.5"/><path d="M3 9h18" stroke="white" stroke-width="1.5"/><path d="M8 3v3M16 3v3" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="cal-num">31</span>
          </div>
          <div class="app-name">Calendar</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-white">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="#e7f0ff" stroke="#3b6ef0" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </div>
          <div class="app-name">Files</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-purple">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><rect x="5" y="7" width="14" height="11" rx="3" fill="white" fill-opacity="0.18" stroke="white" stroke-width="1.6"/><circle cx="9.5" cy="12.5" r="1.3" fill="white"/><circle cx="14.5" cy="12.5" r="1.3" fill="white"/><path d="M12 4v3" stroke="white" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="3.2" r="1" fill="white"/></svg>
          </div>
          <div class="app-name">AI Chat</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-blue">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="app-name">Code Editor</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-black">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M5 7l5 5-5 5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 17h6" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <div class="app-name">Terminal</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-blue">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="4" ry="9" stroke="white" stroke-width="1.4"/><path d="M3 12h18" stroke="white" stroke-width="1.4"/></svg>
          </div>
          <div class="app-name">Browser</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-white">
            <div class="pinwheel"></div>
          </div>
          <div class="app-name">Photos</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell" data-app>
          <div class="app-icon bg-red">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M9 18V6l10-2v12" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.3" fill="white"/><circle cx="17" cy="16" r="2.3" fill="white"/></svg>
          </div>
          <div class="app-name">Music</div>
          <div class="app-status"></div>
        </button>

        <button class="app-cell app-cell-add" data-app>
          <div class="app-icon bg-dashed">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <div class="app-name">Add App</div>
          <div class="app-status"></div>
        </button>

      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
