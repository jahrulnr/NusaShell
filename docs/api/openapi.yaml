openapi: "3.1.0"
info:
  title: NusaShell WebUI API
  version: "0.1.0"
  summary: Local single-seat HTTP API for the NusaShell conversation engine.
  description: |
    **Status: implemented.** The HTTP surface described here is served by
    `nusashell serve`, alongside the multiplexed WebSocket turn channel and
    the embedded browser WebUI (see `websocket.md` and `docs/README.md`).
    Interactive Swagger UI itself remains proposed future work — this
    document is the reference contract.

    ## Transport model

    Ordinary resource reads and management writes happen over HTTP on this
    API. Live turn traffic — streaming deltas and the commands that drive
    turns — happens over a single multiplexed WebSocket at `GET /api/ws`,
    whose frame protocol is defined in `websocket.md`, not here. There is no
    client-facing SSE anywhere on this surface.

    ## Security model (single-seat, optional owner login)

    `server.bind` sets the listen address (loopback by default) and
    `server.auth` decides whether the owner must log in:

    - `auto` — login is required when the bind address is reachable from
      beyond this machine, and skipped on a loopback-only listener.
    - `on` — login is always required.
    - `off` — no login. This combination with an exposed bind is refused at
      start, because every agent and shell tool would be open to the network.

    A login is the owner password (bcrypt, `nusashell password`) exchanged
    at `POST /api/auth/login` for a `nusashell_session` cookie. Sessions are
    HttpOnly, expire after 30 days of disuse, and carry a CSRF token that
    `GET /api/auth/status` returns. Every unsafe request (`POST`, `PUT`,
    `PATCH`, `DELETE`) under `/api` must repeat that token in
    `X-CSRF-Token`, else `403 csrf`. A missing or wrong session is
    `401 unauthenticated`; repeated failures are throttled, then
    `429 too_many_attempts`.

    `/api/health`, `/api/auth/*`, and `/api/mcp/*` are reachable without a
    session — the first is liveness, the second is how a login happens, and
    the third carries a per-thread MCP token of its own. Everything outside
    `/api` is the WebUI page and its assets, which the login screen needs.

    Two header checks apply to every request whatever the auth mode, and
    stand in for a session layer on a listener that has none:

    - Every request: `Host` must match a `server.hosts` alias with the
      configured port. Defaults are `127.0.0.1` and `localhost`.
      Otherwise `403 forbidden_origin`.
    - Unsafe methods (`POST`, `PUT`, `PATCH`, `DELETE`) and the WebSocket
      upgrade: `Origin` must be present and match one configured host
      alias with the configured port. Otherwise `403 forbidden_origin`.
      Non-browser clients must set `Origin` explicitly; there is no exemption.

    ## Errors

    Every 4xx/5xx error response is `application/problem+json` with a
    stable machine `code`, `status`, and a display-safe `detail`.
    Internal causes (upstream bodies, file paths, stack data) are never
    serialized. (The `101` WebSocket upgrade is a successful non-2xx and
    carries no body.)

    ## Notation

    - Timestamps are RFC 3339 (`format: date-time`).
    - "Provider optionalContent" — adapter-namespaced replay artifacts such
      as `gemini.thought_signature` — is never serialized, in either
      direction.
    - `file://` and `data:` URIs are never serialized. Attachments project
      metadata only.
servers:
  - url: "http://127.0.0.1:{port}"
    description: Loopback listener; default host alias.
    variables:
      port:
        default: "10994"
        description: Configured by server.port; changes apply after restart.
  - url: "http://localhost:{port}"
    description: Loopback listener; enabled by default in server.hosts.
    variables:
      port:
        default: "10994"
        description: Configured by server.port; changes apply after restart.

tags:
  - name: system
    description: Liveness.
  - name: auth
    description: Owner login status, login, and logout.
  - name: conversations
    description: Conversation projections, ranged history, and room lifecycle.
  - name: providers
    description: API provider management (upsert is full replace).
  - name: settings
    description: Effective JSON config — projected, leaf-level writes.
  - name: tools
    description: Registered tool catalog.
  - name: updates
    description: Newest-release picture, forced check, and the in-app install job.
  - name: realtime
    description: The multiplexed WebSocket (frames in websocket.md).
  - name: projects
    description: Projects group threads that work on the same folders; deleting one can be undone.
  - name: agents
    description: ACP agents, their sign-in, and what a running agent asks the owner.
  - name: automations
    description: Prompts run on a schedule, with their run history.
  - name: channels
    description: WhatsApp and Telegram - status, pairing, settings, and the chats linked to threads.
  - name: mcp
    description: MCP servers the owner configures, and the relay to the built-in ones.
  - name: notifications
    description: Desktop notifications on the machine the server runs on.
  - name: browser
    description: A thread's browser - live view, annotations, saved logins, recordings, and installing one.
  - name: workspace
    description: Files, references, and uploads inside a thread's folders.
  - name: skills
    description: The Skills page, the level each learned skill answers to, and the proposals waiting on the owner.

# Every operation needs an owner session unless it says `security: []`,
# but only when `server.auth` requires a login at all (see the security
# model above): on a loopback listener in `auto` mode nothing is refused.
#
# The CSRF header is deliberately not part of this global requirement: it
# is needed on unsafe methods only, which OpenAPI cannot express as one
# requirement without per-operation overrides. The `csrfHeader` scheme
# records the header; the security model above states when it applies.
security:
  - cookieAuth: []

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: "ok" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Whether a login is required, and whether this caller has one
      description: |
        A caller that sends no session, or a dead one, gets
        `required: true` with `authenticated: false` — a `200`, not a `401`:
        the question is about the caller's state, and the login screen asks
        it before it has a session.
      security: []
      responses:
        "200":
          description: Login state for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
              example: { required: true, authenticated: false }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Exchange the owner password for a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: |
            Logged in. Sets the `nusashell_session` cookie (HttpOnly,
            SameSite=Strict, Secure behind TLS) and returns the session's
            CSRF token for the unsafe requests that follow.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "nusashell_session=<token>; Path=/; HttpOnly; SameSite=Strict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
              example: { required: true, authenticated: true, csrfToken: "…" }
        "401":
          description: Wrong password, or no live session behind the cookie.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: "urn:nusashell:problem:unauthenticated"
                title: "Unauthorized"
                status: 401
                code: "unauthenticated"
                detail: "wrong password"
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "429":
          description: Too many failed logins from this client; wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: "urn:nusashell:problem:too_many_attempts"
                title: "Too Many Requests"
                status: 429
                code: "too_many_attempts"
                detail: "too many failed logins"

  /api/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: End the session and clear the cookie
      responses:
        "204":
          description: Session ended. The cookie is cleared whatever happened.
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/owner/password:
    post:
      operationId: changeOwnerPassword
      tags: [auth]
      summary: Set or change the owner password
      description: |
        Needs this page's session and CSRF token like any other route.
        `current` must match the password set now — a wrong one counts
        with failed logins — and is ignored while none is set. Every
        session ends; when logins are required the caller gets a new
        session cookie and CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new]
              properties:
                current: { type: string }
                new: { type: string, description: "4 characters to 72 bytes." }
              additionalProperties: false
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: No live session while logins are required.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The current password is wrong, or the request's origin or CSRF token is.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Too many wrong passwords from this client; wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations
      description: |
        Conversation projections ordered by `updatedAt` descending
        (best-effort). Backed by a full repository `List` sliced after the
        fact — the result is **not a snapshot**: writes between page
        requests shift offsets, so a client paging a live list may see
        duplicates or gaps.
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: Zero-based index into the ordered list.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: One page of conversation projections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
              example:
                data:
                  - id: "c_k4j9xm2p8q1vz7w0t6nb5r3yhd"
                    title: "fix flaky cache test"
                    providerId: "openrouter"
                    modelId: "openai/gpt-5"
                    usage: { inputTokens: 4120, cacheReadTokens: 0, cacheWriteTokens: 0, outputTokens: 812, totalInputTokens: 4120, totalTokens: 4932 }
                    createdAt: "2026-01-12T09:14:02Z"
                    updatedAt: "2026-01-12T09:31:47Z"
                    messageCount: 14
                    activeCount: 14
                    sealedSegments: 0
                page: { offset: 0, limit: 30, total: 41, hasMore: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteAllConversations
      tags: [conversations]
      summary: Delete every conversation and purge room artifacts
      description: |
        Removes every room — each delete preempts a running turn rather
        than skipping it — then purges the artifacts only rooms own:
        uploads, page-mark picks, browser recordings, and saved views
        (the fresh-room view included). When any room fails to delete,
        the global purge is skipped so survivors keep their files; the
        error names the failed ids. On success the cross-thread activity
        log is cleared with the purge.
        Requires a same-origin `Origin` header and the confirmation body
        `{"confirm":"DELETE"}` — anything else is `400 confirm_required`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              additionalProperties: false
              properties:
                confirm:
                  type: string
                  enum: ["DELETE"]
      responses:
        "200":
          description: Purged; `deleted` is the room count.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/conversation-control/activity:
    get:
      operationId: listConversationControlActivity
      tags: [conversations]
      summary: Cross-thread tool-call log
      description: |
        The newest entries of the bounded ring (500) recording which
        thread called which `conversation` MCP tool — metadata only:
        caller, tool, target, outcome (`ok`|`error`), duration. Message
        text and tool arguments are never logged. A `target` that never
        resolved to a thread id is empty (as is `list`'s).
      parameters:
        - name: caller
          in: query
          schema: { type: string }
          description: Only entries made by this thread.
        - name: target
          in: query
          schema: { type: string }
          description: Only entries aimed at this thread.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [at, caller, tool, outcome, durationMs]
                      properties:
                        at: { type: string, format: date-time }
                        caller: { type: string }
                        tool: { type: string, description: Tool name (list, read, send, spawn, …) }
                        target: { type: string }
                        outcome: { type: string, enum: [ok, error] }
                        durationMs: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get one conversation
      responses:
        "200":
          description: The conversation projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
              example:
                id: "c_k4j9xm2p8q1vz7w0t6nb5r3yhd"
                title: "fix flaky cache test"
                providerId: "openrouter"
                modelId: "openai/gpt-5"
                usage: { inputTokens: 4120, cacheReadTokens: 0, cacheWriteTokens: 0, outputTokens: 812, totalInputTokens: 4120, totalTokens: 4932 }
                createdAt: "2026-01-12T09:14:02Z"
                updatedAt: "2026-01-12T09:31:47Z"
                messageCount: 14
                activeCount: 6
                sealedSegments: 2
                canCompact: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: annotateConversation
      tags: [conversations]
      summary: Update a conversation — title, project, pin, label, routing, or runtime
      description: |
        Applies any subset of the room's editable properties, in one queued
        write. The write runs on the room's worker so it cannot race a
        running turn's metadata saves — the request may take a moment and can
        lose the race to a delete (`410`).
        Requires a same-origin `Origin` header.

        The runtime fields (`agentId`, `providerId`, `modelId`) are what the
        model picker sends. A room's runtime is otherwise written only by a
        turn, so a picker that kept its choice in the browser left a room
        answering on an old binding whenever the next turn came from a chat.
        An agent is validated and bound, releasing the provider pair; a
        provider model is validated against the provider's catalog and
        releases the agent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotateConversationRequest" }
            examples:
              rename:
                value: { title: "cache invalidation bugfix" }
              pickModel:
                value: { providerId: "deepseek", modelId: "deepseek-v4.1-flash" }
              pickAgent:
                value: { agentId: "claude" }
      responses:
        "200":
          description: Changes applied; returns the updated projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Interrupted" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/InputTooLarge" }
        "429": { $ref: "#/components/responses/QueueFull" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation
      description: |
        Removes the room and all of its storage — meta, live tail, every
        sealed segment. A running turn is interrupted first and any jobs
        still queued on the room die with `410`. The repository delete runs
        on a server-scoped context: abandoning the HTTP request mid-flight
        cannot half-delete a room. Afterwards the id is free — a new
        `turn.send` with the same id mints a fresh room.
        Requires a same-origin `Origin` header.
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Interrupted" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listMessages
      tags: [conversations]
      summary: Ranged message history
      description: |
        Messages over the conversation's **global logical history** —
        sealed archive segments first, then the live tail — in append
        order, backed by `LoadAt`.

        - `start >= 0` is an absolute index.
        - `start < 0` counts back from the end: `start=-50` begins at the
          50th message from the end.
        - `limit` caps how many messages return, max 100.

        The response resolves the range explicitly: `effectiveStart` is
        the absolute index the read began at (clamped into `[0, total]`),
        `nextStart` is the index to continue forward from (`null` when
        `hasMore` is false). Indexes are not stable across writes — after
        any terminal turn frame, re-fetch rather than merge.

        Tool calls project the owner-visible call record (`id`, `name`,
        `status`, exact `input`, `calledAt`, and `output` when recorded,
        plus any tool-produced `attachments`); attachments project
        `mediaType`, `modality`, `uri`, and optional `name` — reference
        locations cross to the loopback owner by design, bytes and the
        sha256 pin never do — and provider `optionalContent` is dropped.
      parameters:
        - name: start
          in: query
          schema: { type: integer, default: -50 }
          description: Absolute index (>= 0) or count back from the end (negative).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: One range of sanitized messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
              example:
                effectiveStart: 12
                nextStart: null
                total: 14
                hasMore: false
                messages:
                  - id: "m_9p2xv7kq4f1nz8w0t6jb5r3yce"
                    role: "user"
                    userType: "origin"
                    content: "the cache test still flakes — look at invalidate()"
                    createdAt: "2026-01-12T09:29:10Z"
                  - id: "m_2r8qa1lv5h0kx9w4t7nc6d3yfg"
                    role: "assistant"
                    content: "Found it — `invalidate()` drops the entry but not the pending in-flight read..."
                    parts:
                      - kind: "text"
                        text: "Found it — `invalidate()` drops the entry but not the pending in-flight read..."
                      - kind: "tool_call"
                        toolCallId: "call_9f2a"
                    finishReason: "tool_calls"
                    toolCalls:
                      - id: "call_9f2a"
                        name: "read_file"
                        status: "completed"
                        input: "{\"path\":\"README.md\"}"
                        output: "…"
                        calledAt: "2026-01-12T09:29:29Z"
                    createdAt: "2026-01-12T09:29:31Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List providers
      description: |
        Sanitized projections of configured providers, sorted by id —
        including records that can't load (undecodable file, unresolvable
        credential), which appear with `broken: true` so the management UI
        can surface and repair them.

        Same paging mechanics as `GET /api/conversations`: the transport
        slices the application's full list after the fact, so the page is
        not a snapshot (provider writes are rare, so drift is mostly
        theoretical — the rule is still best-effort).
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: Zero-based index into the ordered list.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: One page of provider projections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderPage" }
              example:
                data:
                  - id: "openrouter"
                    name: "OpenRouter"
                    style: "completion"
                    endpoint: "https://openrouter.ai/api/v1"
                    keySet: true
                    keyState: "vaulted"
                    broken: false
                    stream: true
                    models:
                      - id: "openai/gpt-5"
                        contextWindow: 400000
                        modelType: "text"
                        inputModalities: ["text", "image"]
                        outputModalities: ["text"]
                        pricing: { inputPerMillionUsd: 1.25, outputPerMillionUsd: 10.0, cacheReadPerMillionUsd: 0.125, cacheWritePerMillionUsd: 0 }
                  - id: "corp-llm"
                    name: ""
                    style: "messages"
                    endpoint: "https://llm.internal.example/v1"
                    keySet: true
                    keyState: "broken"
                    broken: true
                    stream: true
                    models: []
                page: { offset: 0, limit: 30, total: 2, hasMore: false }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/providers/{providerId}/upstreams:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: discoverProviderUpstreams
      tags: [providers]
      summary: List the upstreams an aggregator provider can serve a model from
      description: |
        Reads the provider's per-model endpoint list (OpenRouter-style
        aggregators) and returns the routable upstream backends. Direct
        providers answer an empty list. The picker echoes `slug` back as
        `payload.upstream` on `turn.send`.
      parameters:
        - name: model
          in: query
          required: true
          schema: { type: string }
          description: Model id within the provider's catalog (e.g. "openai/gpt-5").
      responses:
        "200":
          description: Routable upstream providers, deduplicated in provider order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, slug]
                      properties:
                        name: { type: string }
                        slug: { type: string, description: "Value echoed as payload.upstream on turn.send" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /api/providers/{providerId}/import-models:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    post:
      operationId: importProviderModels
      tags: [providers]
      summary: Merge the provider catalog into a stored provider
      description: |
        Re-runs the model import against the stored record — the same
        merge `PUT` performs after writing — without resending the
        document. The stored endpoint, style, and credential do the
        fetch: ids the provider advertises that the record lacks are
        appended, and entries already present keep their parameters. A
        catalog fetch or merge failure still answers `200` with
        `catalogError` set, because the record itself is intact.
        Requires a same-origin `Origin` header.
      responses:
        "200":
          description: The merged provider projection plus the import outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderWriteResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/providers/{providerId}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get one provider
      description: Returns the sanitized projection. A provider whose credential cannot resolve still renders, marked `broken`.
      responses:
        "200":
          description: The provider projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: upsertProvider
      tags: [providers]
      summary: Create or fully replace a provider
      description: |
        Upsert with **full-replace** semantics — there is no PATCH for
        providers. The path id is authoritative: a body `id` does not exist
        in the schema and is rejected `400` (the document is strict). Every
        readable field is the whole truth on each call:
        omitting `name` or `models` clears them, and `stream` omitted
        falls back to the domain default (`true`).

        `apiKey` is the one write-only exception, tri-state:

        - absent — keep the stored credential verbatim (`env:`/`secret:`
          indirections survive edits to other fields); on a new provider,
          configures no key.
        - `""` — clear the credential (the ref and its vault entry).
        - any other value — a literal is vaulted under
          `provider/<id>/api_key` and the record stores only its `secret:`
          reference; an `"env:NAME"`/`"secret:<key>"` value persists
          as-is for callers managing their own indirection.

        After the replace is written, the provider catalog merges into
        the record: ids the provider advertises that the document did not
        carry are appended, while entries already present keep their
        stored parameters. A catalog fetch or merge failure does not
        change the write's success — the response stays `200` and carries
        the failure text in `catalogError`.

        Key material is never returned — the response is the same
        sanitized projection as `GET`, plus the import outcome: `added`
        (always present) lists the newly merged ids, `catalogError`
        appears only when the merge failed. Requires a same-origin
        `Origin` header.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpsert" }
            example:
              name: "OpenRouter"
              style: "completion"
              endpoint: "https://openrouter.ai/api/v1"
              stream: true
              apiKey: "sk-or-v1-…"
              models:
                - id: "openai/gpt-5"
                  contextWindow: 400000
                  modelType: "text"
                  inputModalities: ["text", "image"]
                  outputModalities: ["text"]
      responses:
        "200":
          description: Upsert applied (create or replace) and the provider catalog merged; returns the projection plus the import outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderWriteResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Interrupted" }
        "413": { $ref: "#/components/responses/InputTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider
      description: |
        Removes the record and its vaulted credential. Conversations bound
        to this provider are untouched — their stored reference dangles and
        the next `turn.send` surfaces `404`, letting the client rebind.
        Requires a same-origin `Origin` header.
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Effective settings
      description: |
        The **effective persisted** configuration — the JSON file as
        stored on disk, merged over built-in defaults; what a restart
        would load, not a snapshot of the running process. Projected to
        browser-safe leaves: `server`, `conversation`, `service`, and `log`
        sections only. Server internals and local filesystem paths
        (e.g. `storage.dir`) are never serialized.
      responses:
        "200":
          description: Effective settings projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
              example:
                server: { port: 10994, bind: "127.0.0.1", hosts: ["127.0.0.1", "localhost"] }
                conversation: { mailbox_cap: 128, max_turn_steps: 512, compact_budget_pct: 80, compact_keep_tail: 4 }
                service: { header_timeout: "30s", idle_timeout: "90s" }
                agents: { idle_timeout: "5m0s" }
                log: { max_lines: 2000, max_files: 9 }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: patchSetting
      tags: [settings]
      summary: Set settings leaves
      description: |
        Body `{values: {key: value}}` where each `key` is a dotted path to a
        **leaf inside the projected document** (e.g. `conversation.max_turn_steps`,
        `server.hosts`, or `models.utility.model`) and each `value` is a JSON
        literal — `null` is refused. Every key is applied, the whole candidate
        document is validated once, and it is written atomically: all or nothing.

        Timing: writes land in the config file. `conversation.*` values are
        picked up by the next submitted job (the app re-reads that section
        per post), `models.*` by the next chat thread or title; `server.*`, `service.*`, and `log.*` apply on next
        process start.
        Requires a same-origin `Origin` header.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingPatch" }
            example: { values: { "models.utility.provider": "openrouter", "models.utility.model": "openai/gpt-5-mini" } }
      responses:
        "200":
          description: Setting applied; returns the updated projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: Tool catalog for a conversation
      parameters:
        - in: query
          name: conversationId
          schema: { type: string }
          description: Persisted conversation ID. Omit for the local starting catalog.
      description: |
        The registered tool schemas, sorted by name — the catalog the turn
        loop re-applies each turn. Note this is the *registered* set, not
        necessarily what reaches the model: `CallableByAgent` filters out
        disabled or `system`-permission schemas per turn. `description`
        and `parameters` are catalog text (they may reference the
        workspace by relative path) and may be redacted for tools whose
        internals are unsafe to expose; `permission` is always honest.
      responses:
        "200":
          description: The tool catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tool" }
              example:
                data:
                  - name: "exec"
                    description: "Run a shell command and return its combined stdout and stderr."
                    enabled: true
                    permission: "agent"
                    parameters:
                      type: "object"
                      properties:
                        command: { type: "string", description: "Shell command to execute" }
                        timeout_ms: { type: "integer", description: "Timeout in milliseconds — default 120000, capped at 300000" }
                        allow_broad_kill: { type: "boolean", description: "Allow a command that stops every matching process (pkill, killall, fuser -k, kill -9 of a pattern). Off by default; kill -9 -1 stays refused" }
                      required: ["command"]
                  - name: "read_file"
                    description: "Read a UTF-8 text file relative to the workspace root."
                    enabled: true
                    permission: "agent"
                    parameters:
                      type: "object"
                      properties:
                        path: { type: "string", description: "Path relative to the workspace root" }
                      required: ["path"]
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/fs/browse:
    get:
      operationId: browseFilesystem
      tags: [fs]
      summary: Directory listing for the workspace picker
      description: |
        Lists the subdirectories of one absolute path — directories only,
        never file contents. An empty `path` defaults to the owner's home
        directory. `parent` ascends toward the filesystem root and
        `roots` lists jump targets ("/" on unix; present drive letters on
        Windows) so targets outside home stay reachable. Listings cap at
        1000 directories.
      parameters:
        - name: path
          in: query
          required: false
          schema: { type: string }
          description: Absolute directory path; empty means the owner's home.
      responses:
        "200":
          description: The directory listing.
          content:
            application/json:
              schema:
                type: object
                required: [path, roots, entries]
                properties:
                  path: { type: string }
                  parent: { type: string, description: "Omitted at the filesystem root" }
                  roots:
                    type: array
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        hidden: { type: boolean }
                  truncated:
                    type: boolean
                    description: True when more than 1000 directories exist under path.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/fs/list:
    get:
      operationId: listFilesystem
      tags: [fs]
      summary: Directory listing with files, for the folder and file pickers
      description: |
        Lists one absolute directory — its subdirectories and its regular
        files (symlinks are followed), each sorted by name without regard to
        case. Hidden directories carry `hidden: true`. A listing is cut at
        the server's entry cap, and `truncated` says so. `parent` is
        omitted at the filesystem root. A relative `path` is `400`; a
        directory that does not exist is `404`; one that cannot be read
        is `403`.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Absolute directory path.
      responses:
        "200":
          description: The directory's contents.
          content:
            application/json:
              schema:
                type: object
                required: [path, dirs, files]
                properties:
                  path: { type: string }
                  parent: { type: string }
                  dirs:
                    type: array
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        hidden: { type: boolean }
                  files:
                    type: array
                    items:
                      type: object
                      required: [name, path, size]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        size: { type: integer, format: int64 }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/context:
    get:
      operationId: contextStats
      tags: [conversations]
      summary: Composer footer token stats
      description: |
        The "~estimate/total Tokens" line: `estimate` is the live input
        size of the named conversation, `total` the bound model's input
        allowance. A conversation bound to an agent (and not given another
        `providerId`) answers with what the agent reported about its own
        session: `total` is its context window, `live` the tokens held, and
        `cost` its cost so far; all stay empty until the agent reports. `conversationId` is optional — a fresh, never-persisted
        room still resolves `total` when `providerId`+`modelId` name a known
        model.
      parameters:
        - name: conversationId
          in: query
          required: false
          schema: { type: string }
        - name: providerId
          in: query
          required: false
          schema: { type: string }
        - name: modelId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Token stats for the composer footer.
          content:
            application/json:
              schema:
                type: object
                required: [estimate, total]
                properties:
                  estimate: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0, description: "The model's input allowance; for an agent room, the context window the agent reported." }
                  live:
                    type: integer
                    minimum: 0
                    description: "Agent rooms only, once the agent has reported: tokens its session's context holds now. `estimate` is `0` for such a room."
                  cost:
                    type: object
                    description: "Agent rooms only, when the agent prices its work: the session's cost so far."
                    required: [amount, currency]
                    properties:
                      amount: { type: number, minimum: 0 }
                      currency: { type: string, example: USD }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/update:
    get:
      operationId: getUpdate
      tags: [updates]
      summary: Cached newest-release picture
      description: |
        The release lookup re-runs only when the server's one-hour cache is
        stale. A failed lookup is reported in `error`; the request still
        succeeds. `enabled` is false for dev builds, which never check.
      responses:
        "200":
          description: The update picture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Update" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/update/check:
    post:
      operationId: checkUpdate
      tags: [updates]
      summary: Forced release lookup
      description: Runs the release lookup now, ignoring the cache, and answers the resulting picture.
      responses:
        "200":
          description: The update picture after a fresh lookup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Update" }

  /api/update/install:
    post:
      operationId: startUpdate
      tags: [updates]
      summary: Start the in-app install of the latest release
      description: |
        Starts one background job: download, verify against `SHA256SUMS`,
        stage beside the binary, replace it, and restart. Only one install
        runs at a time. A refusal names its reason in `code`.
      responses:
        "202":
          description: The install started; the body is its first progress state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateProgress" }
        "409":
          description: Refused — `update_busy`, `update_disabled`, `update_not_available`, or `update_unknown`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500":
          description: The install could not start (`update_failed`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      operationId: getUpdateProgress
      tags: [updates]
      summary: Progress of the current or most recent install
      responses:
        "200":
          description: The install's progress; `idle` when none has run since the process started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateProgress" }

  /api/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      description: Every project, pinned first, then by name. `threads` counts the project's threads. Not paged.
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      description: A project groups threads that work on the same folders; a thread in it runs in the first folder (its primary) and agents also get the others.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectWrite" }
            example: { name: "web", folders: ["/home/me/web"], pinned: false }
      responses:
        "201":
          description: The new project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/projects/{projectId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one project
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: updateProject
      tags: [projects]
      summary: Replace a project's name, folders, and pin
      description: |
        A full edit. `updatedAt` must be the value of the project the edit
        started from; a project saved since is refused `409`, so a stale tab
        cannot overwrite a newer folder list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: pinProject
      tags: [projects]
      summary: Pin or unpin a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned: { type: boolean }
              additionalProperties: false
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      description: Its threads stay, outside any project. The ids of the threads released are returned so the delete can be undone with `POST /api/projects/{projectId}/restore`.
      responses:
        "200":
          description: The project is gone.
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released:
                    type: array
                    items: { type: string }
                    description: Thread ids that were in the project.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/projects/{projectId}/restore:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: restoreProject
      tags: [projects]
      summary: Undo a project's deletion
      description: |
        Recreates the project under its old id with the name, folders, and
        pin sent. The threads in `released` rejoin it while they are still
        outside any project; one that joined another project meanwhile stays
        there. A project with that id existing again is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                folders: { type: array, items: { type: string } }
                pinned: { type: boolean }
                released: { type: array, items: { type: string }, description: The ids the delete answered with. }
              additionalProperties: false
      responses:
        "201":
          description: The project is back.
          content:
            application/json:
              schema:
                type: object
                required: [project, rejoined]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  rejoined: { type: array, items: { type: string }, description: Thread ids that rejoined. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List ACP agents
      description: External agents the app drives over the Agent Client Protocol. Launch environment values are never shown, only how each is held.
      responses:
        "200":
          description: Every configured agent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/detect:
    get:
      operationId: detectAgents
      tags: [agents]
      summary: Agent CLIs found on PATH
      description: Known agent CLIs installed on this machine. `registered` says one is already configured.
      responses:
        "200":
          description: Candidates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgentCandidate" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/import:
    post:
      operationId: importAgents
      tags: [agents]
      summary: Configure every detected agent
      description: Registers every detected CLI that has no agent yet, under its detected id and command with the `ask` policy.
      responses:
        "200":
          description: The agents that were added.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/{agentId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get one agent
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putAgent
      tags: [agents]
      summary: Create or replace an agent
      description: |
        Upsert by id; the agent's running process stops so the next turn
        launches with the new definition. An `env` value is a literal secret
        to store, or the stored reference the agent's view shows in
        `env[].ref` (`secret:<key>` or `env:NAME`) to keep that variable as
        it is. An empty `policy` means `ask`. `autoStart` and `defaults`
        replace the stored ones, so a client that edits one sends the other
        back as it read it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentWrite" }
            example: { name: "Codex", command: "codex-acp", args: [], env: {}, policy: "ask" }
      responses:
        "200":
          description: The stored agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Remove an agent
      responses:
        "204": { description: The agent is removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/{agentId}/models:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listAgentModels
      tags: [agents]
      summary: The models an agent offers
      description: Starts the agent on first use, which can take a while; an agent that cannot start answers an error.
      responses:
        "200":
          description: The agent's models; `current` marks the one it runs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgentModel" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/{agentId}/options:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listAgentSessionOptions
      tags: [agents]
      summary: The agent's own session options
      description: The session options (and legacy modes) the agent offers before any thread exists — from its stored catalog or a probe session — so a picker can show them; values are the agent's, and a thread's own overrides are read from its agent-options. Starts the agent on first use, which can take a while.
      responses:
        "200":
          description: The options.
          content:
            application/json:
              schema:
                type: object
                required: [data, status, source]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgentOption" } }
                  status: { $ref: "#/components/schemas/OptionsStatus" }
                  source: { $ref: "#/components/schemas/OptionsSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/{agentId}/status:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: getAgentStatus
      tags: [agents]
      summary: Process state, recent stderr, and sign-in methods
      responses:
        "200":
          description: The agent's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/{agentId}/authenticate:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: authenticateAgent
      tags: [agents]
      summary: Sign an agent in
      description: Runs one of the agent's authentication methods. It may start the agent and wait for a browser flow, so it can take minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [methodId]
              properties:
                methodId: { type: string }
              additionalProperties: false
      responses:
        "204": { description: Signed in. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/{agentId}/logout:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: logoutAgent
      tags: [agents]
      summary: Sign an agent out
      description: For agents whose status reports `canLogout`.
      responses:
        "204": { description: Signed out. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/agents/{agentId}/restart:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: restartAgent
      tags: [agents]
      summary: Restart an agent process
      description: Stops the agent's process; the next turn starts it again.
      responses:
        "204": { description: Restarted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: List automations
      description: Automations with their next run and latest run. `timezone` is the server's, the default for new schedules.
      responses:
        "200":
          description: Every automation.
          content:
            application/json:
              schema:
                type: object
                required: [data, timezone]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Automation" } }
                  timezone: { type: string, example: "Asia/Jakarta" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createAutomation
      tags: [automations]
      summary: Create an automation
      description: Runs a prompt on a schedule, on an agent or a provider model, in a new thread per run or in one thread it keeps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationWrite" }
            example: { name: "Morning digest", prompt: "Summarize overnight changes", providerId: "openrouter", modelId: "openai/gpt-5", schedule: "cron", cron: "0 8 * * 1-5", timezone: "Asia/Jakarta", thread: "new" }
      responses:
        "201":
          description: The new automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/automations/{automationId}:
    parameters:
      - { name: automationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: getAutomation
      tags: [automations]
      summary: Get one automation
      responses:
        "200":
          description: The automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: updateAutomation
      tags: [automations]
      summary: Replace an automation
      description: A full edit; `updatedAt` must be the value the edit started from, else `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationUpdate" }
      responses:
        "200":
          description: The updated automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: enableAutomation
      tags: [automations]
      summary: Pause or resume an automation
      description: Resuming a repeating automation plans from that moment; it does not catch up on runs missed while paused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
              additionalProperties: false
      responses:
        "200":
          description: The updated automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete an automation and its run history
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/automations/{automationId}/runs:
    parameters:
      - { name: automationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listAutomationRuns
      tags: [automations]
      summary: Run history
      description: The automation's latest 50 runs, newest first (each automation keeps its latest 100).
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AutomationRun" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: runAutomationNow
      tags: [automations]
      summary: Run an automation now
      description: Starts a run without moving the schedule. The run is live in the WebUI like any turn. An automation runs one firing at a time, so a run while another is going is `409`.
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/automations/{automationId}/test:
    parameters:
      - { name: automationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: testAutomationNotify
      tags: [automations]
      summary: Send a test message to the result chat
      description: Needs `notify` set; waits up to 20 seconds for the chat to take it.
      responses:
        "204": { description: The chat took the message. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: Chat channel status
      description: WhatsApp and Telegram, with their state, account, whether a pairing QR is waiting, and the senders refused since the last allowlist change.
      responses:
        "200":
          description: One entry per channel.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ChannelStatus" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/channels/{channel}/settings:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    get:
      operationId: getChannelSettings
      tags: [channels]
      summary: A channel's settings document
      description: Allowlists, group policy, and for WhatsApp `retentionDays`, `sendPacing`, and `queueCap`. Secrets show only as `tokenSet`. The document differs per channel; see `contract.md`.
      responses:
        "200":
          description: The settings document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: updateChannelSettings
      tags: [channels]
      summary: Change a channel's settings
      description: |
        Changes the fields given and answers the stored document. The
        allowlists also take `addNumbers`/`removeNumbers`/`addGroups`/
        `removeGroups` (WhatsApp) and `addUserIds`/`removeUserIds`/
        `addGroupIds`/`removeGroupIds` (Telegram) to change a list in place;
        an entry that is not a valid id is `400`. Telegram's `token` is
        write-only: absent keeps it, `""` deletes it, a value replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The stored settings document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/channels/{channel}/connect:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    post:
      operationId: connectChannel
      tags: [channels]
      summary: Connect a channel
      description: WhatsApp connects a paired device, or starts QR pairing (the status then reports `hasQr`). Telegram validates the bot token and starts polling. A failure is `400` with the reason.
      responses:
        "200":
          description: The channel's status after the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{channel}/disconnect:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    post:
      operationId: disconnectChannel
      tags: [channels]
      summary: Disconnect a channel
      description: WhatsApp drops the connection and the device stays linked; Telegram stops polling until the next connect.
      responses:
        "200":
          description: The channel's status after the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{channel}/logout:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    post:
      operationId: logoutChannel
      tags: [channels]
      summary: Sign a channel out
      description: WhatsApp unlinks the device from the phone; Telegram forgets the bot token.
      responses:
        "200":
          description: The channel's status after the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{channel}/qr:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    get:
      operationId: getChannelQr
      tags: [channels]
      summary: The pairing QR code
      description: A PNG while a pairing waits for a scan (`hasQr` in the status); `404` otherwise. Never cached.
      responses:
        "200":
          description: The QR code.
          content:
            image/png:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{channel}/groups:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    get:
      operationId: listChannelGroups
      tags: [channels]
      summary: Groups the account is in
      description: For channels that have groups (WhatsApp); `404` on the others. The account must be connected.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{channel}/send:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    post:
      operationId: sendChannelMessage
      tags: [channels]
      summary: Send a message from the account
      description: |
        For channels that send on request (WhatsApp): text, a reply, an
        edit, a revoke, a reaction, media, a sticker, a location, a contact,
        an event, or a poll, as `nusashell channel whatsapp send` does. The
        body is one JSON object whose keys depend on the kind; its size is
        bounded by the channel's file limit. A failure to send is `502
        send_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: What was sent, as the channel reports it.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The channel could not send.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/channels/{channel}/user:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    get:
      operationId: getChannelUser
      tags: [channels]
      summary: Look up a person on the channel
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: The person's number or id. }
      responses:
        "200":
          description: What the channel knows about them.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{channel}/contacts:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    get:
      operationId: searchChannelContacts
      tags: [channels]
      summary: Search the account's contacts
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches names and numbers. }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 50 } }
      responses:
        "200":
          description: One page of contacts.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{channel}/messages:
    parameters:
      - { $ref: "#/components/parameters/Channel" }
    get:
      operationId: searchChannelMessages
      tags: [channels]
      summary: Search the messages the channel kept
      description: A full-text search over every message the account saw or sent, plus the history synced at pairing. Old messages go after `retentionDays`.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Full-text query; empty lists the newest. }
        - { name: chat, in: query, schema: { type: string }, description: Only this chat. }
        - { name: sender, in: query, schema: { type: string }, description: Only this sender. }
        - { name: cursor, in: query, schema: { type: string }, description: The `nextCursor` of the previous page. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 50 } }
        - { name: raw, in: query, schema: { type: boolean }, description: Include each message's raw payload. }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
                  nextCursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/chats:
    get:
      operationId: listChats
      tags: [channels]
      summary: Every chat linked to a thread
      description: The chats an automation can send its result to.
      responses:
        "200":
          description: Linked chats.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ChatLink" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/conversations/{conversationId}/links:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listConversationLinks
      tags: [channels]
      summary: Chats linked to one thread
      responses:
        "200":
          description: The thread's linked chats.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ChatLink" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: unlinkConversationChat
      tags: [channels]
      summary: Unlink a chat from a thread
      description: Removes the chat's link to the thread; `key` comes from the listing.
      parameters:
        - { name: chat, in: query, required: true, schema: { type: string }, description: The link's `key`. }
      responses:
        "204": { description: Unlinked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/mcp-servers:
    get:
      operationId: listMcpServers
      tags: [mcp]
      summary: List the MCP servers the owner configured
      description: Agents get the enabled ones in each session and the model runtime offers their tools as `<server>_<tool>`. Values of environment variables and headers are never shown, only their names.
      responses:
        "200":
          description: Every configured server, with its connection state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createMcpServer
      tags: [mcp]
      summary: Add an MCP server
      description: A command on stdio, or a URL over streamable HTTP or SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerWrite" }
            example: { name: "files", transport: "stdio", command: "npx", args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/me"], env: [] }
      responses:
        "201":
          description: The new server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/mcp-servers/{serverId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: getMcpServer
      tags: [mcp]
      summary: Get one MCP server
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: updateMcpServer
      tags: [mcp]
      summary: Replace an MCP server
      description: A full edit; `updatedAt` must be the value the edit started from (RFC 3339), else `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerUpdate" }
      responses:
        "200":
          description: The updated server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: enableMcpServer
      tags: [mcp]
      summary: Enable or disable an MCP server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
              additionalProperties: false
      responses:
        "200":
          description: The updated server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteMcpServer
      tags: [mcp]
      summary: Remove an MCP server
      description: Its environment and header values leave the secret store.
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/mcp/{server}:
    parameters:
      - { name: server, in: path, required: true, schema: { type: string, enum: [conversation, browser] }, description: A built-in tool server. }
    get:
      operationId: listBuiltinMcpTools
      tags: [mcp]
      summary: A built-in MCP server's tools
      description: |
        The relay `nusashell mcp run <server>` uses for ACP agents, so they
        reach the built-in `conversation` and `browser` tool servers. It
        needs no owner session: a per-thread token, sent as `Authorization:
        Bearer <token>`, identifies the thread; a missing or unknown token is
        `401`.
      security: []
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string }, description: "`Bearer <thread token>`." }
      responses:
        "200":
          description: The server's name and tool definitions.
          content:
            application/json:
              schema:
                type: object
                required: [name, tools]
                properties:
                  name: { type: string }
                  tools: { type: array, items: { type: object, additionalProperties: true } }
        "401": { description: "Unknown thread token., content: { application/problem+json: { schema: { $ref: \"#/components/schemas/Problem\" } } }" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: callBuiltinMcpTool
      tags: [mcp]
      summary: Call a built-in MCP tool
      description: Runs one tool for the thread the token names. A tool that fails answers `200` with an error result, as MCP does.
      security: []
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string }, description: "`Bearer <thread token>`." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool: { type: string }
                arguments: { type: object, additionalProperties: true }
              additionalProperties: false
      responses:
        "200":
          description: The MCP tool result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Unknown thread token., content: { application/problem+json: { schema: { $ref: \"#/components/schemas/Problem\" } } }" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Desktop notification status
      description: Whether the switch (`notifications.desktop`) is on, whether this host can show them, and through which backend.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, available, backend]
                properties:
                  enabled: { type: boolean }
                  available: { type: boolean, description: "Whether a backend (notify-send, gdbus, osascript, PowerShell) was found." }
                  backend: { type: string }
                  reason: { type: string, description: Why notifications are unavailable. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/notifications/test:
    post:
      operationId: testNotification
      tags: [notifications]
      summary: Show a test notification
      responses:
        "204": { description: The notification was handed to the desktop. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/conversations/{conversationId}/export:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: exportConversation
      tags: [conversations]
      summary: Export a thread as JSON
      description: The conversation and every message in one pretty-printed document, served as a download named `nusashell-<id>.json`.
      responses:
        "200":
          description: The export.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: "`attachment; filename=nusashell-<id>.json`."
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, conversation, messages]
                properties:
                  exportedAt: { type: string, format: date-time }
                  conversation: { $ref: "#/components/schemas/Conversation" }
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/conversations/{conversationId}/approvals:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listApprovals
      tags: [agents]
      summary: Permission requests waiting in a thread
      description: What a running agent asked and nobody answered yet. The same requests arrive as `turn.approval` frames; this read restores them after a reload.
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/conversations/{conversationId}/approvals/{requestId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - { name: requestId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: answerApproval
      tags: [agents]
      summary: Answer a permission request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string, description: "One of the request's `options[].id`." }
              additionalProperties: false
      responses:
        "204": { description: The agent got the answer. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/elicitations:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listElicitations
      tags: [agents]
      summary: Questions an agent is waiting on
      description: Forms and URLs an agent asked the owner to fill or visit (the `turn.elicitation` frames), for a view that opened after they arrived.
      responses:
        "200":
          description: Pending elicitations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Elicitation" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/conversations/{conversationId}/elicitations/{elicitationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - { name: elicitationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: answerElicitation
      tags: [agents]
      summary: Answer an agent's question
      description: Only the outcome stays in history; what the owner typed is never kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, decline, cancel] }
                content: { type: object, additionalProperties: true, description: "The form's values; only with `accept`." }
              additionalProperties: false
      responses:
        "204": { description: The agent got the answer. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/agent-options:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listAgentOptions
      tags: [agents]
      summary: An agent session's options
      description: The session config options (and legacy modes) the thread's agent offers, such as a reasoning level. Kept per thread.
      responses:
        "200":
          description: The options.
          content:
            application/json:
              schema:
                type: object
                required: [data, status, source]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgentOption" } }
                  status: { $ref: "#/components/schemas/OptionsStatus" }
                  source: { $ref: "#/components/schemas/OptionsSource" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setAgentOption
      tags: [agents]
      summary: Change an agent session option
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, value]
              properties:
                id: { type: string }
                value: { type: string }
              additionalProperties: false
      responses:
        "200":
          description: The options after the change — the pick applied now.
          content:
            application/json:
              schema:
                type: object
                required: [data, status, source]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgentOption" } }
                  status: { $ref: "#/components/schemas/OptionsStatus" }
                  source: { $ref: "#/components/schemas/OptionsSource" }
        "202":
          description: |
            The pick is taken but not applied yet. A turn fixes its runtime and
            session options when it starts, so the next one carries it; the
            body is the same list plus `pending`, naming the pick that waits.
          content:
            application/json:
              schema:
                type: object
                required: [data, status, source]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgentOption" } }
                  status: { $ref: "#/components/schemas/OptionsStatus" }
                  source: { $ref: "#/components/schemas/OptionsSource" }
                  pending: { $ref: "#/components/schemas/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/commands:
    get:
      operationId: listCommands
      tags: [conversations]
      summary: The composer's slash-command catalog
      description: |
        A harness room carries the native commands (`compact`, `clear`,
        `fork`). An agent room carries the thread commands NusaShell owns
        (`clear`, `fork`) plus exactly the commands its agent session reports;
        context operations are never invented for it, so `compact` exists there
        only as an agent-reported row. An agent-reported name wins a collision
        with a native thread command. `source` says who owns a row;
        `enabled`/`reason` are the server's verdict for the room.

        Without `conversationId` every native row is off with
        `reason: "Send a message first"`. A live transport turn turns rows off
        with `reason: "Wait for the turn to finish"`; an empty harness room
        has nothing to act on.
      parameters:
        - name: conversationId
          in: query
          required: false
          schema: { type: string }
          description: The room whose availability the catalog reports.
      responses:
        "200":
          description: The catalog, native rows first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Command" } }
              example:
                data:
                  - name: "compact"
                    description: "Summarize older history into a checkpoint"
                    hint: ""
                    source: "native"
                    enabled: true
                    reason: ""
                  - name: "review"
                    description: "Review the working tree"
                    hint: "/review [path]"
                    source: "agent"
                    enabled: true
                    reason: ""
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/commands:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: runCommand
      tags: [conversations]
      summary: Run one native command
      description: |
        An action, not a turn: no message is written and no `turn.*` frame is
        emitted. `compact` folds the live tail into a checkpoint — the same
        compaction the header button used to POST; `clear` empties the room's
        messages, folds, and tool output while keeping its identity, and drops
        its agent session; `fork` copies the whole logical history and the
        tool-output files it references into a new room titled
        `<source title> (fork)`.

        The answer is the room detail projection the command leaves the caller
        on — the new room for a fork.

        Every precondition is enforced here rather than by the transport: a
        live transport turn refuses every command (`409 busy`), `clear`
        requires `confirm: true` or the word `confirm` as its only argument
        (`409 confirmation_required`), native compaction does not apply to an
        agent room (`409 unavailable`), and a room with nothing to act on
        answers `400 nothing_to_*`. Arguments are fixed in this version — `compact` and
        `fork` take none, `clear` only `confirm` — and anything else, like an
        unknown name, is `400 invalid_argument`. A recognized command is never
        downgraded to text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: A catalog name, matched case-sensitively. }
                args: { type: string, description: "Arguments; `clear` accepts only `confirm`." }
                confirm: { type: boolean, description: The confirmation a destructive command needs. }
              additionalProperties: false
            example: { name: "clear", args: "", confirm: true }
      responses:
        "200":
          description: The command ran; the room it leaves the caller on.
          content:
            application/json:
              schema:
                type: object
                required: [command, conversation]
                properties:
                  command: { type: string }
                  conversation: { $ref: "#/components/schemas/Conversation" }
        "400":
          description: Unknown name, stray arguments, or a room with nothing to act on (`nothing_to_compact`, `nothing_to_clear`, `nothing_to_fork`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: "urn:nusashell:problem:nothing_to_clear"
                title: "Bad Request"
                status: 400
                code: "nothing_to_clear"
                detail: "This thread is empty"
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Interrupted" }
        "409":
          description: A live turn (`busy`), a missing confirmation (`confirmation_required`), or a command that does not apply to this room kind (`unavailable`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: "urn:nusashell:problem:confirmation_required"
                title: "Conflict"
                status: 409
                code: "confirmation_required"
                detail: "nothing is cleared without confirm"
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/QueueFull" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }

  /api/conversations/{conversationId}/approval-rules:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listApprovalRules
      tags: [agents]
      summary: Approval rules a thread's agent has
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApprovalRule" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/approval-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - { name: ruleId, in: path, required: true, schema: { type: string, minLength: 1 } }
    delete:
      operationId: deleteApprovalRule
      tags: [agents]
      summary: Forget an approval rule
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/uploads:
    post:
      operationId: uploadFile
      tags: [workspace]
      summary: Upload a file for a message
      description: A multipart form with one `file` part, up to 25 MB. The returned id rides the next turn as an attachment (`payload.uploads`). A missing or generic media type is sniffed from the name, then the bytes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored file.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "413": { $ref: "#/components/responses/InputTooLarge" }

  /api/references:
    get:
      operationId: listReferenceCandidates
      tags: [workspace]
      summary: Candidates for @ and / references
      description: |
        What the composer's menus offer from the server: the files and folders
        of the place's workspace (honoring `.gitignore`), skills, and MCP
        servers, matched against `q`. Threads, projects, and an agent's
        commands come from their own lists
        (`GET /api/conversations`, `GET /api/projects`,
        `GET /api/conversations/{conversationId}/commands`). At most 25 per kind and 100 in all;
        `truncated` says some were left out.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/PlaceConversation"
        - $ref: "#/components/parameters/PlaceProject"
        - $ref: "#/components/parameters/PlaceWorkspace"
      responses:
        "200":
          description: Candidates.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReferenceCandidate" } }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/roots:
    get:
      operationId: listWorkspaceRoots
      tags: [workspace]
      summary: The folders a place covers
      description: The absolute folders of a thread, a project, or a workspace path.
      parameters:
        - $ref: "#/components/parameters/PlaceConversation"
        - $ref: "#/components/parameters/PlaceProject"
        - $ref: "#/components/parameters/PlaceWorkspace"
      responses:
        "200":
          description: The roots.
          content:
            application/json:
              schema:
                type: object
                required: [roots]
                properties:
                  roots: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/files:
    get:
      operationId: readFile
      tags: [workspace]
      summary: Read a file inside a place's folders
      description: |
        Streams one file. `path` is a local path, a `~` path, or a `file:`
        URL; a relative path resolves in the place's workspace. Images,
        video, audio and PDF display inline unless `download=1`; everything
        else downloads. The file is served `nosniff` under a sandboxing
        Content-Security-Policy. This serves the owner's own machine to them:
        any regular file the server can read, inside the place's folders or not.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: string, enum: ["1"] } }
        - $ref: "#/components/parameters/PlaceConversation"
        - $ref: "#/components/parameters/PlaceProject"
        - $ref: "#/components/parameters/PlaceWorkspace"
      responses:
        "200":
          description: The file's bytes; Range requests are honored where the file can seek.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/files:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: readConversationFile
      tags: [workspace]
      summary: Read a file inside a thread's folders
      description: The same as `GET /api/files`, with the place fixed to the thread (it only changes what a relative `path` resolves against).
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: The file's bytes.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/terminal:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: openConversationTerminal
      tags: [realtime]
      summary: The owner's terminal in a thread's folder (WebSocket)
      description: Upgrades to a WebSocket carrying a shell that starts in the thread's workspace. Same-origin rule as `/api/ws`. Needs a pseudo-terminal, which only Linux hosts have for now.
      responses:
        "101": { description: Switching protocols. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/view:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getThreadView
      tags: [conversations]
      summary: What the owner left in a thread's view
      description: The WebUI's own document — the unsent draft and the side pane — kept so a reload or another device opens the thread as it was. `{}` with `updatedAt` 0 when nothing is kept.
      responses:
        "200":
          description: The kept view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadViewAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
    put:
      operationId: putThreadView
      tags: [conversations]
      summary: Keep a thread's view
      description: Replaces the kept document; `{}` forgets it. Deleting the thread deletes its view.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadViewBody" }
      responses:
        "200":
          description: The kept view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadViewAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/InputTooLarge" }

  /api/view:
    get:
      operationId: getNewThreadView
      tags: [conversations]
      summary: What the owner left in the new-thread composer
      responses:
        "200":
          description: The kept view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadViewAnswer" }
    put:
      operationId: putNewThreadView
      tags: [conversations]
      summary: Keep the new-thread composer's view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadViewBody" }
      responses:
        "200":
          description: The kept view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadViewAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "413": { $ref: "#/components/responses/InputTooLarge" }

  /api/agents/{agentId}/sign-in:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: openAgentSignIn
      tags: [agents]
      summary: Run an agent's terminal sign-in (WebSocket)
      description: Upgrades to a WebSocket terminal running the agent's command line with the `terminal` method's arguments and variables, in the owner's home folder. Same messages and origin rule as `/api/terminal`. When it exits the agent's process stops so its next start reads the new login. Needs a pseudo-terminal, which only Linux hosts have for now.
      parameters:
        - { name: methodId, in: query, required: true, schema: { type: string } }
        - { name: cols, in: query, schema: { type: integer } }
        - { name: rows, in: query, schema: { type: integer } }
      responses:
        "101": { description: Switching protocols. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/terminal:
    get:
      operationId: openTerminal
      tags: [realtime]
      summary: The owner's terminal (WebSocket)
      description: Upgrades to a WebSocket carrying a shell outside any thread. Same-origin rule as `/api/ws`. Needs a pseudo-terminal, which only Linux hosts have for now.
      responses:
        "101": { description: Switching protocols. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/conversations/{conversationId}/browser/ws:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: openBrowserLiveView
      tags: [browser]
      summary: Live view of a thread's browser tab (WebSocket)
      description: |
        Upgrades to the WebSocket that streams the tab as JPEG frames with
        state updates (page, device, lease, profile) and takes the owner's
        input once they take over: click, drag, scroll, type, paste, keys,
        navigation, and a device preset. The agent can lock input
        (`browser_lock`); a takeover ends the lock. Same-origin rule as `/api/ws`.
      responses:
        "101": { description: Switching protocols. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/browser:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getBrowserStatus
      tags: [browser]
      summary: Is the thread's browser running
      responses:
        "200":
          description: "`open: false`, or the tab's page, device, input lease, and profile."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserStatus" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
    post:
      operationId: startBrowser
      tags: [browser]
      summary: Open the thread's browser
      description: |
        Starts the thread's browser for its owner, on `url` when one is
        given and on a blank tab otherwise, and answers as the status read
        does. A bare host gets `https://`; only `http` and `https` addresses
        are accepted, anything else is `400` before a browser starts. The
        agent's browser tools open the same session, so a page the owner
        opens is the one the agent then sees. When no Chrome or Chromium can
        be found the call fails; `GET /api/browser/install` says how to get
        one. Launching Chrome can take several seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, description: Address to open; empty opens a blank tab. }
              additionalProperties: false
            example: { url: "example.com" }
      responses:
        "200":
          description: The session's page, device, input lease, and profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: closeBrowser
      tags: [browser]
      summary: End the thread's browser session
      responses:
        "204": { description: Closed; also when none was open. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/conversations/{conversationId}/browser/annotate:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: annotateBrowser
      tags: [browser]
      summary: Mark an element or region in the live view
      description: Turns a pick into an annotation ready for the composer; it travels with the next message as `payload.annotations`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [element, region, page] }
                x: { type: number }
                y: { type: number }
                width: { type: number }
                height: { type: number }
                marker: { type: integer, description: The marker number shown on the page. }
      responses:
        "201":
          description: The pick.
          content:
            application/json:
              schema:
                type: object
                required: [pickId, marker, descriptor, upload]
                properties:
                  pickId: { type: string }
                  marker: { type: integer }
                  descriptor: { type: object, additionalProperties: true, description: "What was picked - selector, element path, role, name, nearby text, rect, point, page URL and viewport." }
                  upload: { type: string, description: Id of the screenshot's upload. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/browser/annotate/preview:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: previewBrowserAnnotation
      tags: [browser]
      summary: The element under a point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
      responses:
        "200":
          description: The element, or `missed` when there is none; `skipped` when a mark was in flight and the hover was dropped.
          content:
            application/json:
              schema:
                type: object
                required: [missed]
                properties:
                  missed: { type: boolean }
                  skipped: { type: boolean }
                  rect: { type: object, additionalProperties: true }
                  tagName: { type: string }
                  name: { type: string }
                  selector: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/browser/annotate/clear:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: clearBrowserAnnotations
      tags: [browser]
      summary: Remove the markers from the page
      responses:
        "204": { description: Cleared. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/conversations/{conversationId}/browser/logins:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listPageLogins
      tags: [browser]
      summary: Saved logins for the page the tab shows
      description: Saved logins of the tab's profile that fit the origin of the page it shows, for the live view's autofill. Passwords are never returned; an empty list when no session is open.
      responses:
        "200":
          description: Matching logins.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BrowserLogin" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/recordings:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listRecordings
      tags: [browser]
      summary: A thread's browser recordings
      description: Recordings are kept in `recordings/` under the data folder for 7 days.
      responses:
        "200":
          description: The thread's recordings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Recording" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/conversations/{conversationId}/recordings/{recordingId}/summary:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - { name: recordingId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: getRecordingSummary
      tags: [browser]
      summary: A recording's summary text
      description: Written when the recording stops; until then the body says so. Never cached.
      responses:
        "200":
          description: The summary.
          content:
            text/plain:
              schema: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/recordings/{recordingId}/events:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - { name: recordingId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listRecordingEvents
      tags: [browser]
      summary: A recording's timeline
      description: Clicks, typing, scrolls, console errors, navigations, network lines, downloads, and the agent's browser tool calls, with secrets masked. Page through it with `after` set to the previous `next`.
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: Return events after this sequence number. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated event types to keep. }
      responses:
        "200":
          description: A page of the timeline.
          content:
            application/json:
              schema:
                type: object
                required: [events, next, done]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/RecordingEvent" } }
                  next: { type: integer, description: Cursor for the next page. }
                  done: { type: boolean, description: Whether the end was reached. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/browser/history:
    get:
      operationId: browserHistory
      tags: [browser]
      summary: Address-bar suggestions from a profile's history
      description: >-
        Pages the profile's tabs finished loading (http and https only). An
        empty `q` is the most recent; otherwise pages whose url or title
        contains it, those starting with it (after the scheme and `www.`)
        first, then the most visited.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: profile, in: query, description: "The default profile when empty.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 8 } }
      responses:
        "200":
          description: Visited pages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [url, title, visits, visitedAt]
                      properties:
                        url: { type: string }
                        title: { type: string }
                        visits: { type: integer }
                        visitedAt: { type: integer, format: int64, description: Unix ms. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/conversations/{conversationId}/browser/console:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: browserConsole
      tags: [browser]
      summary: What the open page logged
      description: The page's console and uncaught errors since it loaded, oldest first, at most the last 200. It never opens a browser.
      responses:
        "200":
          description: Console lines.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [level, text, ts]
                      properties:
                        level: { type: string, enum: [log, info, warn, error, debug] }
                        text: { type: string }
                        ts: { type: integer, format: int64, description: Unix ms. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/browser/eval:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: browserEval
      tags: [browser]
      summary: Run the owner's JavaScript in the open page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expression]
              properties:
                expression: { type: string, maxLength: 65536 }
      responses:
        "200":
          description: The value, awaited when a promise.
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value: { description: The value as JSON. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/InputTooLarge" }
        "422":
          description: The script threw.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/browser/profiles:
    get:
      operationId: listBrowserProfiles
      tags: [browser]
      summary: Named browser profiles
      description: Profiles keep their own logins across threads and restarts, under `browser/` in the data folder.
      responses:
        "200":
          description: Profile names.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/browser/logins:
    get:
      operationId: listBrowserLogins
      tags: [browser]
      summary: Saved logins
      description: Logins saved from the live view, per profile and origin. Passwords live in the secret store and are never returned.
      parameters:
        - { name: profile, in: query, schema: { type: string }, description: Only this profile. }
      responses:
        "200":
          description: The logins.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BrowserLogin" } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/browser/logins/{loginId}:
    parameters:
      - { name: loginId, in: path, required: true, schema: { type: string, minLength: 1 } }
    delete:
      operationId: deleteBrowserLogin
      tags: [browser]
      summary: Forget a saved login
      description: The password leaves the secret store.
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/browser/install:
    get:
      operationId: getBrowserInstallOffer
      tags: [browser]
      summary: Is a browser installed, and how to get one
      description: Whether a Chrome or Chromium resolves, and when none does, what was searched and each way to install one, most preferred first.
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserInstallOffer" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: installBrowser
      tags: [browser]
      summary: Install a browser
      description: Runs one of the offered methods - Chrome for Testing into `<storage>/chrome`, or a package manager. It can take minutes. Success is what resolves afterwards, not the installer's exit status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, description: "An `id` from the offer." }
              additionalProperties: false
      responses:
        "200":
          description: The outcome, with the installer's output.
          content:
            application/json:
              schema:
                type: object
                required: [log]
                properties:
                  execPath: { type: string, description: The executable that resolves now. }
                  error: { type: string }
                  log: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/ws:
    get:
      operationId: openWebSocket
      tags: [realtime]
      summary: Multiplexed turn WebSocket
      description: |
        Upgrades to the single WebSocket that carries all turn traffic —
        the commands `turn.send`, `turn.edit`, `turn.resume`, `turn.cancel`,
        `turn.watch`, `turn.steer`, `turn.steer_recall`
        and the event stream `turn.opened` (carries `steerable`: `true` or
        `false`, never omitted; absent means unknown and the client queues —
        normative rules in `websocket.md`)/`turn.delta`/`turn.phase`/
        `turn.tool_call`/`turn.tool_input`/`turn.tool_output` (ordered
        tool argument and output chunks — progress, not completion)
        /`turn.step_finished`/`turn.completed`/
        `turn.failed`, plus `turn.cancel_ack`, `turn.steer_ack`,
        `turn.steer_recalled`, `turn.resync_required`, and
        a generic `error` frame for malformed commands.

        The handshake must satisfy the same-origin rule: `Host` must match
        a configured `server.hosts` alias with the configured port, and
        `Origin` must match that host origin. Violations are rejected `403`
        before upgrade.

        **The frame protocol is defined normatively in `websocket.md`
        (docs/api/websocket.md) — this spec describes only the HTTP
        upgrade; Swagger/OpenAPI does not model WebSocket frames.** There
        is no SSE endpoint anywhere on this API.
      responses:
        "101":
          description: Switching Protocols — the socket is open; frames per websocket.md.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: The Skills page
      description: |
        Every live catalog row, joined with who may change it and what waits on
        the owner. `level` is the row's level while the row describes the file on
        disk, and `user` otherwise. `changed` says the file was edited outside the
        loop since its row was written. `digest` is the whole file on disk: a level
        move sends it back unchanged. Reading writes nothing. The page is not
        paged, because the catalog is bounded by the byte budget the loop enforces.
        Both skill paths are mounted only when the server wires every skill port;
        a build without them answers `404`.
      parameters:
        - name: workspace
          in: query
          schema: { type: string }
          description: The workspace folder whose skill root the page joins. Empty means no workspace root.
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillPage" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/skills/{name}/level:
    post:
      operationId: moveSkillLevel
      tags: [skills]
      summary: Move a learned skill to the owner or to the loop
      description: |
        The owner's decision about who a learned skill answers to. `agent` hands
        the skill to the loop (`Loop may propose`); `user` takes it back. The body
        carries the digest the page showed, and the move counts only while the file
        on disk still holds that digest: a file that moved since the page loaded
        answers `409`, and so does a row another decision moved meanwhile. A move
        to `agent` grants the loop authority over the bytes the owner saw, so a
        hand-edited skill can be handed back. A builtin or an owner file answers
        `400`; a skill that is no longer live, or has no ownership row, answers
        `404`. The skill file is never written.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: The learned skill's name.
        - name: workspace
          in: query
          schema: { type: string }
          description: The workspace folder whose skill root the move reads. Empty means no workspace root.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillMoveBody" }
      responses:
        "204": { description: The level moved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/skill-proposals:
    get:
      operationId: listSkillProposals
      tags: [skills]
      summary: The proposals waiting on the owner
      description: |
        Every pending proposal. `open` says whether the owner can still accept it,
        by the rule accept applies before it writes. A proposal that is not open
        stays in the list with `staleCause`, the one sentence that says why, until
        the owner dismisses it. Reading writes nothing.
      parameters:
        - name: workspace
          in: query
          schema: { type: string }
          description: The workspace folder whose skill root the queue reads. Empty means no workspace root.
      responses:
        "200":
          description: The pending proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillProposalPage" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/skill-proposals/{id}/decide:
    post:
      operationId: decideSkillProposal
      tags: [skills]
      summary: Accept or dismiss a proposal
      description: |
        `accept` writes the skill file, then records the decision and the ownership
        row in one transaction. A create writes the file under the nusashell root.
        A patch rewrites its target and keeps the agent level, so `level` must be
        empty or `agent`.

        `dismiss` records the decision with the owner's `reason`, which is required
        and may not open with `superseded:`. A dismissal that closes a create whose
        file is the loop's own leftover archives that file first; a patch's bytes
        stay where they are.

        A proposal that was already decided answers `409`. So does one the owner can
        no longer accept: that answer names the state it found, and the proposal
        stays pending until the owner dismisses it. An accept that would take the
        catalog over its byte budget answers `409` with the overage.

        When the file is written but the decision cannot be recorded, the answer is
        `500` and the failure is logged; a row that refuses the decision after the
        write answers `409` and is logged too. A create's leftover is the loop's
        own, so accepting again finishes it. For a patch, the loop wrote the skill
        file, but the decision was not recorded, and the proposal no longer applies
        to that file: the owner dismisses it and sets the skill's level on the
        Skills page. Dismissing leaves the file in place.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The proposal's id.
        - name: workspace
          in: query
          schema: { type: string }
          description: The workspace folder whose catalog the decision is read against. Empty means no workspace root.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillDecideBody" }
      responses:
        "204": { description: The proposal was accepted or dismissed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nusashell_session
      description: |
        Owner session from `POST /api/auth/login`, valid for 30 days of use.
        HttpOnly, so only the browser sends it.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The session's CSRF token, returned by `GET /api/auth/status` and
        `POST /api/auth/login`. Required on unsafe methods (`POST`, `PUT`,
        `PATCH`, `DELETE`); a missing or wrong token is `403 csrf`. Safe
        methods need the cookie alone.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Path-safe conversation id. Server-minted ids look like `c_<base32>`; client-minted ids are accepted if path-safe.
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Configured provider id (path-safe, e.g. `openrouter`).

    Channel:
      name: channel
      in: path
      required: true
      schema: { type: string, enum: [whatsapp, telegram] }
      description: Channel name; another name is `404`.
    PlaceConversation:
      name: conversationId
      in: query
      schema: { type: string }
      description: Place the call in this thread's folders.
    PlaceProject:
      name: projectId
      in: query
      schema: { type: string }
      description: Place the call in this project's folders.
    PlaceWorkspace:
      name: workspace
      in: query
      schema: { type: string }
      description: Place the call in this folder, before any thread exists.

  schemas:
    SkillRow:
      type: object
      required: [name, description, source, path, digest, level, tracked, changed, pending, pendingStale]
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [builtin, nusashell, global, workspace]
          description: The root that holds the skill.
        path:
          type: string
        digest:
          type: string
          description: The whole file on disk. A level move sends it back unchanged.
        level:
          type: string
          enum: [user, agent]
          description: Who may change the skill now.
        tracked:
          type: boolean
          description: An ownership row exists for the skill.
        changed:
          type: boolean
          description: The file was edited outside the loop since its row was written, so the level is the owner's.
        pending:
          type: integer
          description: Proposals waiting on the owner for this skill.
        pendingStale:
          type: integer
          description: Those the owner can no longer accept.
    SkillPage:
      type: object
      required: [data, diagnostics, pending, pendingStale]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SkillRow" }
        diagnostics:
          type: array
          items: { type: string }
          description: The catalog's own diagnostics, then one line for each ownership row whose file no longer reads as a skill.
        pending:
          type: integer
          description: Every proposal waiting on the owner.
        pendingStale:
          type: integer
          description: Those the owner can no longer accept.
    SkillMoveBody:
      type: object
      required: [level, digest]
      properties:
        level:
          type: string
          enum: [user, agent]
        digest:
          type: string
          description: The file digest the page showed.
    SkillProposalEvidence:
      type: object
      required: [kind, quote, date]
      properties:
        kind:
          type: string
          enum: [quote, repeat, call, rewrite]
        quote:
          type: string
          description: The text the proposal cites as its evidence.
        date:
          type: [string, "null"]
          format: date-time
          description: When the evidence happened. Null when the turn carried no time.
    SkillProposal:
      type: object
      required: [id, op, kind, name, description, target, tool, reason, evidence, createdAt, open, staleCause]
      properties:
        id:
          type: string
        op:
          type: string
          enum: [create, patch]
        kind:
          type: string
        name:
          type: string
        description:
          type: string
        target:
          type: string
          description: The skill a patch changes. Empty for a create.
        tool:
          type: string
        reason:
          type: string
        evidence:
          $ref: "#/components/schemas/SkillProposalEvidence"
        createdAt:
          type: string
          format: date-time
        open:
          type: boolean
          description: Whether the owner can still accept the proposal.
        staleCause:
          type: string
          description: One sentence saying why the owner can no longer accept it. Empty while open.
    SkillProposalPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SkillProposal" }
    SkillDecideBody:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, dismiss]
        level:
          type: string
          enum: [user, agent]
          description: Accept only. Empty means agent, and a patch accepts at agent only.
        reason:
          type: string
          description: Dismiss only. Required and not blank; it may not open with `superseded:`, the prefix the loop writes for the proposals it retires.
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: "ok" }
      additionalProperties: false

    ThreadViewBody:
      type: object
      required: [document]
      properties:
        document: { type: object, description: "The WebUI's own JSON object, at most 256 KB." }
      additionalProperties: false
    ThreadViewAnswer:
      type: object
      required: [view]
      properties:
        view:
          type: object
          required: [document, updatedAt]
          properties:
            document: { type: object }
            updatedAt: { type: integer, description: "Unix milliseconds; 0 when nothing is kept." }
    AuthStatus:
      type: object
      required: [required, authenticated]
      properties:
        required:
          type: boolean
          description: Whether this server asks for a login at all under the current `server.auth` and bind.
        authenticated:
          type: boolean
          description: Whether the caller's cookie names a live session. Always true when no login is required.
        csrfToken:
          type: string
          description: Present only for an authenticated caller — the token every unsafe request must repeat in `X-CSRF-Token`.
        hasPassword:
          type: boolean
          description: For a signed-in caller, whether an owner password is set — changing it then asks for the current one.
      additionalProperties: false

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URN — `urn:nusashell:problem:<code>`.
          example: "urn:nusashell:problem:not_found"
        title: { type: string, example: "Not Found" }
        status: { type: integer, example: 404 }
        code:
          type: string
          enum: [invalid_argument, nothing_to_compact, nothing_to_clear, nothing_to_fork, forbidden_origin, unauthenticated, csrf, too_many_attempts, not_found, interrupted, busy, confirmation_required, gone, input_too_large, queue_full, internal, upstream_error, unavailable, upstream_timeout]
          description: Stable machine code for programmatic routing.
        detail:
          type: string
          description: Display-safe explanation. Never contains internal causes, file paths, or upstream bodies.
          example: "conversation not found"
        instance: { type: string, description: "Optional request-scoped reference." }
      additionalProperties: false

    Usage:
      type: object
      required: [inputTokens, cacheReadTokens, cacheWriteTokens, outputTokens, totalInputTokens, totalTokens]
      properties:
        inputTokens:
          type: integer
          minimum: 0
          description: Uncached input tokens only (cache counters are disjoint).
        cacheReadTokens: { type: integer, minimum: 0 }
        cacheWriteTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        totalInputTokens:
          type: integer
          minimum: 0
          description: Derived convenience — inputTokens + cacheReadTokens + cacheWriteTokens.
        totalTokens:
          type: integer
          minimum: 0
          description: Derived convenience — totalInputTokens + outputTokens.
      additionalProperties: false

    Conversation:
      type: object
      required: [id, providerId, modelId, environment, usage, createdAt, updatedAt, messageCount, activeCount, sealedSegments]
      properties:
        id: { type: string, example: "c_k4j9xm2p8q1vz7w0t6nb5r3yhd" }
        title:
          type: string
          description: Display title; derived from the first user line on a fresh room, settable via PATCH. May be empty.
        providerId:
          type: string
          description: Bound provider id; empty when the conversation has never successfully bound.
        modelId:
          type: string
          description: Model id within the provider's catalog (or the agent's model in an agent room); empty when unbound.
        effort:
          type: string
          description: The reasoning effort the owner picked for the room; absent means the model's configured effort.
        upstream:
          type: string
          description: The aggregator backend the owner pinned for the room; absent means the provider decides.
        workspace:
          type: string
          description: Directory the room's tools work in according to its selected environment; empty defers to that driver's default workspace.
        environment:
          type: string
          enum: [local, ssh, docker]
          description: Persisted execution environment binding. Only registered drivers are available; currently local is registered.
        usage: { $ref: "#/components/schemas/Usage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messageCount:
          type: integer
          minimum: 0
          description: Total logical messages across sealed segments plus the live tail.
        activeCount:
          type: integer
          minimum: 0
          description: Messages in the live tail only — the range the model sees.
        sealedSegments:
          type: integer
          minimum: 0
          description: Number of compacted archive segments.
        canCompact:
          type: boolean
          description: Present on detail and command responses; whether manual compaction can fold new live history.
        activeTurnId:
          type: string
          description: Present on detail and on list items while this process has a non-terminal transport turn for the room. A client attaches with turn.watch. Omitted when the room is idle and never part of persisted state.
        activeTurnKind:
          type: string
          enum: [send, edit]
          description: Command that opened activeTurnId. Present only together with that field.
        waiting:
          type: integer
          minimum: 0
          description: Jobs queued behind the room's running turn — the same number the conversation.queued notice carries. Present on detail and on list items so a tab that missed that notice still opens on the real count; omitted when nothing waits and never part of persisted state.
        pending:
          $ref: "#/components/schemas/Pending"
      additionalProperties: false

    Page:
      type: object
      required: [offset, limit, total, hasMore]
      description: Offset-page metadata shared by list endpoints — best-effort, not a snapshot.
      properties:
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
      additionalProperties: false

    ConversationPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        page: { $ref: "#/components/schemas/Page" }
      additionalProperties: false

    ProviderPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Provider" }
        page: { $ref: "#/components/schemas/Page" }
      additionalProperties: false

    Message:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string, example: "m_9p2xv7kq4f1nz8w0t6jb5r3yce" }
        role:
          type: string
          enum: [system, user, developer, assistant]
        content: { type: string }
        parts:
          type: array
          description: Ordered assistant answer, reasoning, and tool-call segments. Text contains exact provider text; render as untrusted text.
          items: { $ref: "#/components/schemas/MessagePart" }
        userType:
          type: string
          enum: [origin, system, compaction, relay]
          description: 'Present on `role: "user"` messages only — `origin` is real user input, `system` is a synthetic user-role artifact (e.g. a compaction instruction), `compaction` is the checkpoint a fold writes, `relay` is a prompt another thread sent.'
        relay:
          type: object
          description: 'Present beside `userType: "relay"` and nowhere else: who sent this prompt. The stored body is the sender''s text alone — a client renders the header from this record, never by parsing the message; the head is assembled at request time only.'
          required: [id, label, title]
          properties:
            id:
              type: string
              description: The sending thread''s conversation id — what a reply is sent to.
            label:
              type: string
              description: The sender''s @handle when it had one, else empty. A snapshot taken when the message was written.
            title:
              type: string
              description: The sender''s title at write time, else empty. A client falls back to the id when empty.
        inputId:
          type: string
          description: 'Present on a user message a steer wrote: the `turn.steer` requestId that submitted it. A reloaded history can match the line against the live steering bubble the turn journal replays, so one submission renders once. Absent on every other message — an ordinary send or an edit carries none.'
        finishReason:
          type: string
          enum: [stop, tool_calls, length, content_filter, interrupted]
          description: Present on assistant messages that ended a provider call.
        toolCalls:
          type: array
          items: { $ref: "#/components/schemas/ToolCallRef" }
          description: Owner-visible call records — exact input and stored result cross to this loopback UI. See trust model in docs/api/contract.md.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentRef" }
          description: Stored references — uri and optional name cross to the owner; the preview route `GET /api/conversations/{id}/files?path=<uri>` serves the bytes.
        references:
          type: array
          description: The owner's selections in a user message's content, by byte offset.
          items:
            type: object
            required: [kind, id, label, start, end]
            properties:
              kind: { type: string, enum: [file, folder, skill, mcp, command, conversation, project] }
              id: { type: string }
              label: { type: string, description: "Exactly content[start:end]." }
              start: { type: integer }
              end: { type: integer }
            additionalProperties: false
        annotations:
          type: array
          description: Live-page marks a user message carried; kept screenshots are its last attachments, in order.
          items:
            type: object
            required: [marker, descriptor]
            properties:
              marker: { type: integer, description: The badge number painted on the screenshot. }
              comment: { type: string }
              screenshot: { type: boolean }
              descriptor:
                type: object
                description: What the page said about the mark (kind element, region, or page; selector, tag, name, rect, page URL, viewport, style, …).
        recording:
          type: object
          required: [id, status]
          description: The browser recording a user message attached; the summary is model context and is not served.
          properties:
            id: { type: string }
            status: { type: string }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    MessagePart:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [text, reasoning, tool_call, plan, approval, elicitation, steer, media]
        text:
          type: string
          description: |
            Exact answer or reasoning text for text/reasoning parts, the
            input for `steer`, and a JSON record for the agent's own parts:
            the plan's entries, an approval or elicitation and its answer,
            and, for `media`, a file the agent put in its reply as an
            attachment reference (`{mediaType, modality, uri, name}`).
        toolCallId:
          type: string
          description: References the matching call in the message's toolCalls array.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentRef" }
          description: Attachments carried by a native steer part.
      additionalProperties: false

    ToolCallRef:
      type: object
      required: [id, name, status, input]
      properties:
        id: { type: string, description: "Provider-issued call id.", example: "call_9f2a" }
        name: { type: string, example: "read_file" }
        type: { type: string, enum: [injection, origin], description: "`origin` = a call the model issued; `injection` = a call the application inserted as context (e.g. workspace hydration)." }
        status:
          type: string
          enum: [pending, completed, failed]
          description: "`pending` = no output recorded yet; `completed` = output stored and the executor reported success; `failed` = the executor reported an error (the plain output text still carries the details)."
        input:
          type: string
          description: Exact argument string the model produced (usually JSON). Owner-visible untrusted text — render escaped, never as markup.
          example: "{\"path\":\"README.md\"}"
        calledAt:
          type: string
          format: date-time
          description: When the call was recorded. Omitted when a hydrated record has no timestamp rather than reporting the zero time.
        output:
          type: string
          description: "Plain tool result text without the provider's untrusted-evidence envelope — present when status is `completed` or `failed`. Omitted for `pending`."
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentRef" }
          description: Media references the tool produced alongside its output — stored references only, resolved bytes are never served.
      additionalProperties: false

    AttachmentRef:
      type: object
      required: [mediaType, modality, uri]
      description: >-
        A stored attachment reference. `uri` serializes the stored
        location — including `file://` local paths — by design for the
        single loopback owner; it is untrusted display text, not a
        fetchable resource. `name` is an optional stored display name
        and can carry path-shaped data. The bytes are served only by
        the owner's file preview route, and the internal `sha256`
        content pin stays server-side.
      properties:
        mediaType: { type: string, example: "image/png" }
        modality:
          type: string
          enum: [text, image, audio, video, file]
          description: Derived from the media type's top-level type.
        uri:
          type: string
          example: "file:///home/user/notes/diagram.png"
          description: Stored reference — `file://` or remote. Owner-visible untrusted text; never markup, never fetched by the server for the client.
        name:
          type: string
          example: "diagram.png"
          description: Optional stored display name — can carry path-shaped data; render as text only.
      additionalProperties: false

    MessagePage:
      type: object
      required: [effectiveStart, nextStart, total, hasMore, messages]
      properties:
        effectiveStart:
          type: integer
          minimum: 0
          description: Absolute index the read began at, after resolving negative `start` and clamping into `[0, total]`.
        nextStart:
          type: [integer, "null"]
          minimum: 0
          description: Index to continue paging forward from; `null` when `hasMore` is false.
        total:
          type: integer
          minimum: 0
          description: Global logical message count at read time — moves as turns append.
        hasMore: { type: boolean }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
      additionalProperties: false

    AnnotateConversationRequest:
      type: object
      description: |
        Any subset of the room's editable properties. At least one field is
        required. The runtime fields are how the model picker binds a room:
        they apply without running a turn, so a thread driven from WhatsApp,
        Telegram, an automation, or another browser runs the owner's choice.
      properties:
        title: { type: string, description: "New display title; may be empty to clear." }
        projectId: { type: string, description: "Project to move the room into; `\"\"` takes it out of its project." }
        pinned: { type: boolean }
        label:
          type: string
          description: "The room's `@handle`; `\"\"` clears it. It must be free."
        routing:
          description: "Reply routing override; `null` returns to the server default."
          oneOf:
            - type: object
              required: [replyToOrigin, mirrorFinal, notifyApprovals]
              additionalProperties: false
              properties:
                replyToOrigin: { type: boolean, description: "Send the final reply back to the chat the turn came from." }
                mirrorFinal: { type: boolean, description: "Also copy the final reply to every other chat linked to the thread." }
                notifyApprovals: { type: boolean, description: "Ask for permission in the origin chat too." }
            - type: "null"
        agentId:
          type: string
          description: |
            Binds the room to an external agent and releases any provider
            route. With `modelId`, the pair names the model the agent
            reports; the agent picks its own.
        providerId:
          type: string
          description: With `modelId`, binds the room to a provider model and releases any agent.
        modelId:
          type: string
          description: "The provider's model; with `agentId`, the agent's model instead."
        effort:
          type: string
          enum: ["", default, none, minimal, low, medium, high, xhigh, max]
          description: "The room's reasoning effort, kept for every turn that names none; `default` and `\"\"` return it to the model's configured effort. An unknown word is `400`."
        upstream:
          type: string
          description: "The room's aggregator backend pin, kept for every turn that names none; `\"\"` lets the provider decide."
      additionalProperties: false

    Provider:
      type: object
      required: [id, name, style, endpoint, keySet, keyState, broken, stream, models]
      properties:
        id: { type: string, example: "openrouter" }
        name: { type: string, description: "Display name; may be empty." }
        style:
          type: string
          enum: [completion, responses, messages, generatecontent]
          description: Wire paradigm the provider speaks.
        endpoint: { type: string, format: uri, example: "https://openrouter.ai/api/v1" }
        keySet:
          type: boolean
          description: A credential is configured in some form (ref or server-held material).
        keyState:
          type: string
          enum: [unset, env, vaulted, broken]
          description: |
            Credential projection, derived from the stored reference:

            - `unset` — nothing stored.
            - `env` — an `env:NAME` indirection that currently resolves.
            - `vaulted` — key material held server-side: a resolvable
              `secret:<key>` vault ref or inline material in the record.
            - `broken` — a credential is configured but cannot resolve
              (missing env var, absent vault entry).

            The raw reference string is never exposed.
        broken:
          type: boolean
          description: The record can't be decoded, or its credential ref can't resolve — the management view surfaces it instead of hiding it.
        stream:
          type: boolean
          description: Whether the provider streams (SSE upstream — internal only; never leaks to this API's clients).
        models:
          type: array
          items: { $ref: "#/components/schemas/Model" }
      additionalProperties: false

    ProviderWriteResult:
      type: object
      required: [id, name, style, endpoint, keySet, keyState, broken, stream, models, added]
      description: |
        The provider projection plus the import outcome of the write that
        produced it — the response shape of `PUT /api/providers/{id}` and
        `POST /api/providers/{id}/import-models`. `GET` never returns it.
      properties:
        id: { type: string, example: "openrouter" }
        name: { type: string, description: "Display name; may be empty." }
        style:
          type: string
          enum: [completion, responses, messages, generatecontent]
          description: Wire paradigm the provider speaks.
        endpoint: { type: string, format: uri, example: "https://openrouter.ai/api/v1" }
        keySet:
          type: boolean
          description: A credential is configured in some form (ref or server-held material).
        keyState:
          type: string
          enum: [unset, env, vaulted, broken]
          description: |
            Credential projection, derived from the stored reference:

            - `unset` — nothing stored.
            - `env` — an `env:NAME` indirection that currently resolves.
            - `vaulted` — key material held server-side: a resolvable
              `secret:<key>` vault ref or inline material in the record.
            - `broken` — a credential is configured but cannot resolve
              (missing env var, absent vault entry).

            The raw reference string is never exposed.
        broken:
          type: boolean
          description: The record can't be decoded, or its credential ref can't resolve — the management view surfaces it instead of hiding it.
        stream:
          type: boolean
          description: Whether the provider streams (SSE upstream — internal only; never leaks to this API's clients).
        models:
          type: array
          items: { $ref: "#/components/schemas/Model" }
        added:
          type: array
          items: { type: string }
          description: Provider model ids the post-write import merged into the catalog — always present, empty when nothing new merged or no catalog is wired.
        catalogError:
          type: string
          description: Present only when the post-write provider-catalog import failed — the record itself saved.
      additionalProperties: false

    Model:
      type: object
      required: [id]
      description: |
        One catalog entry. Generation parameters that are unset are simply
        absent — "absent" means "don't send" and lets the provider default
        apply; it never serializes as `0` or `null`. Provider
        `optionalContent` is never serialized — the API cannot express it
        in either direction. On `PUT` replace the application preserves a
        stored model's hidden `optionalContent` while its `id` survives
        (see contract.md — this preservation rule is implementation work).
      properties:
        id: { type: string, example: "openai/gpt-5" }
        temperature: { type: number }
        topP: { type: number }
        topK: { type: integer }
        maxOutputTokens: { type: integer, minimum: 0 }
        presencePenalty: { type: number }
        frequencyPenalty: { type: number }
        seed: { type: integer }
        stopSequences:
          type: array
          items: { type: string }
        effort:
          type: string
          enum: [default, none, minimal, low, medium, high, xhigh, max]
          description: Reasoning effort; `default`/absent omits it from the wire.
        modelType:
          type: string
          enum: [text, embedding, video, image, speech, transcription, audio, rerank, decision, realtime]
        style:
          type: string
          enum: [completion, responses, messages, generatecontent]
          description: Wire-surface override for this model — absent means the request speaks the provider's `style`. For models that only exist on one surface (e.g. `claude-*` on messages, `gpt-*-luna` on responses behind a mixed-protocol endpoint).
        contextWindow:
          type: integer
          minimum: 0
          description: Total context window in tokens; `0` = unknown (the engine budgets against a floor).
        outputLimit:
          type: integer
          minimum: 0
          description: Max completion tokens the provider declares; `0` = unknown.
        maxImages:
          type: integer
          minimum: 0
          description: Per-request image cap this serving enforces; `0` = none declared (fail open).
        name:
          type: string
          description: Display name the provider publishes.
        canonical:
          type: string
          description: Stable base id the catalog declares (survives id churn); empty = undeclared.
        aliasOf:
          type: string
          description: Target id when the entry is a pure alias; empty = not an alias.
        supportedEfforts:
          type: array
          items: { type: string, enum: [none, minimal, low, medium, high, xhigh, max] }
          description: Effort levels the catalog declares; empty = unknown (picker fails open).
        pricing: { $ref: "#/components/schemas/Pricing" }
        inputModalities:
          type: array
          items: { $ref: "#/components/schemas/Modality" }
          description: Empty/absent = unknown — capability is the provider's call.
        outputModalities:
          type: array
          items: { $ref: "#/components/schemas/Modality" }
      additionalProperties: false

    ModelInput:
      type: object
      required: [id]
      description: |
        Write shape for one catalog entry inside a provider upsert — same
        fields as `Model`, same "absent = unset" semantics. Duplicate
        `id`s in one catalog are `400`. `optionalContent` is intentionally
        absent from this write shape: the server keeps each stored model's
        hidden `optionalContent` across the replace while its `id`
        survives; a model dropped from the catalog loses it with the
        record.
      properties:
        id: { type: string }
        temperature: { type: number }
        topP: { type: number }
        topK: { type: integer, minimum: 0 }
        maxOutputTokens: { type: integer, minimum: 0 }
        presencePenalty: { type: number }
        frequencyPenalty: { type: number }
        seed: { type: integer }
        stopSequences:
          type: array
          items: { type: string }
        effort:
          type: string
          enum: [default, none, minimal, low, medium, high, xhigh, max]
        modelType:
          type: string
          enum: [text, embedding, video, image, speech, transcription, audio, rerank, decision, realtime]
        style:
          type: string
          enum: [completion, responses, messages, generatecontent]
          description: Wire-surface override; absent/empty = inherit the provider's `style`.
        contextWindow: { type: integer, minimum: 0 }
        outputLimit: { type: integer, minimum: 0 }
        maxImages: { type: integer, minimum: 0 }
        name: { type: string }
        canonical: { type: string }
        aliasOf: { type: string }
        supportedEfforts:
          type: array
          items: { type: string, enum: [none, minimal, low, medium, high, xhigh, max] }
        pricing: { $ref: "#/components/schemas/Pricing" }
        inputModalities:
          type: array
          items: { $ref: "#/components/schemas/Modality" }
        outputModalities:
          type: array
          items: { $ref: "#/components/schemas/Modality" }
      additionalProperties: false

    Modality:
      type: string
      enum: [text, image, audio, video, file]

    Pricing:
      type: object
      required: [inputPerMillionUsd, outputPerMillionUsd, cacheReadPerMillionUsd, cacheWritePerMillionUsd]
      description: Per-1M-token USD rate card — informational catalog metadata, never authoritative for billing.
      properties:
        inputPerMillionUsd: { type: number, minimum: 0 }
        outputPerMillionUsd: { type: number, minimum: 0 }
        cacheReadPerMillionUsd: { type: number, minimum: 0 }
        cacheWritePerMillionUsd: { type: number, minimum: 0 }
      additionalProperties: false

    ProviderUpsert:
      type: object
      required: [style, endpoint]
      description: |
        The full provider document. The path id is authoritative — a body
        `id` is forbidden by schema and rejected `400`. Every readable
        field is authoritative: omitting `name` or `models` clears them;
        `stream` omitted resets to the domain default `true`. `apiKey` is
        write-only and tri-state (absent = keep, `""` = clear, value =
        set). Server-owned `optionalContent` on stored models is preserved
        across the replace for model `id`s that survive — it is never on
        the wire and cannot be written here.
      properties:
        name: { type: string }
        style:
          type: string
          enum: [completion, responses, messages, generatecontent]
        endpoint: { type: string, format: uri }
        stream: { type: boolean }
        apiKey:
          type: string
          writeOnly: true
          description: Tri-state credential write — never echoed back.
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelInput" }
      additionalProperties: false

    Settings:
      type: object
      required: [server, conversation, service, agents, log, notifications, models]
      description: Effective settings, projected to browser-safe leaves. Durations serialize as Go duration strings (`"30s"`).
      properties:
        server:
          type: object
          required: [port, bind, hosts]
          description: WebUI listener and accepted HTTP host aliases. Changes apply after restart.
          properties:
            port:
              type: integer
              minimum: 1
              maximum: 65535
              description: TCP port for the listener; default 10994.
            bind:
              type: string
              description: Listener IP address; defaults to 127.0.0.1. Bind a LAN IP and include it in hosts to allow LAN access.
            hosts:
              type: array
              minItems: 1
              description: Hostname or IP aliases without ports. Does not change the listen address.
              items: { type: string, minLength: 1 }
          additionalProperties: false
        conversation:
          type: object
          required: [mailbox_cap, max_turn_steps, compact_budget_pct, compact_keep_tail]
          properties:
            mailbox_cap:
              type: integer
              minimum: 0
              description: Per-room job queue capacity; a full mailbox answers `429 queue_full`.
            max_turn_steps:
              type: integer
              minimum: 0
              description: Provider-call cap per turn before `500 internal`.
            compact_budget_pct:
              type: integer
              minimum: 0
              maximum: 100
              description: Share of the model context window that triggers proactive compaction (default 80).
            compact_keep_tail:
              type: integer
              minimum: 1
              description: Recent messages that survive compaction alongside the checkpoint.
          additionalProperties: false
        service:
          type: object
          required: [header_timeout, idle_timeout]
          properties:
            header_timeout: { type: string, description: "Upstream first-byte deadline; 2m by default.", example: "2m0s" }
            idle_timeout: { type: string, description: "Per-chunk deadline on a streaming upstream body.", example: "90s" }
          additionalProperties: false
        agents:
          type: object
          required: [idle_timeout]
          properties:
            idle_timeout: { type: string, description: "How long an agent's process may run no turn before the server stops it; the next message starts it again and restores the thread's session. At least `1m`; `5m0s` by default. Checked every minute and read each time, so a change applies without a restart. An agent set to start with the server is never stopped.", example: "5m0s" }
          additionalProperties: false
        log:
          type: object
          required: [max_lines, max_files]
          properties:
            max_lines: { type: integer, minimum: 0 }
            max_files: { type: integer, minimum: 0 }
          additionalProperties: false
        notifications:
          type: object
          required: [desktop]
          properties:
            desktop:
              type: string
              enum: ["on", "off"]
              description: Desktop notifications on the machine the server runs on; read on each notification, so a change applies at once.
          additionalProperties: false
        models:
          type: object
          required: [chat, utility, embedding, transcription, image, video, speech]
          description: The model for each job the app runs on its own; read when the job runs, so a change applies at once. An empty role is unassigned.
          properties:
            chat:
              type: object
              required: [agent, provider, model]
              description: Answers threads that chat channels start. An agent (with `model` as its optional model) or a provider and model, not both; empty takes the first agent, then the first provider.
              properties:
                agent: { type: string }
                provider: { type: string }
                model: { type: string }
              additionalProperties: false
            utility: { $ref: "#/components/schemas/ModelRole" }
            embedding: { $ref: "#/components/schemas/ModelRole" }
            transcription: { $ref: "#/components/schemas/ModelRole" }
            image: { $ref: "#/components/schemas/ModelRole" }
            video: { $ref: "#/components/schemas/ModelRole" }
            speech: { $ref: "#/components/schemas/ModelRole" }
          additionalProperties: false
      additionalProperties: false

    ModelRole:
      type: object
      required: [provider, model]
      description: A provider model for an app job. `utility` titles threads after their first reply; `embedding` (vectors for memory), `transcription` (speech to text), and `image`, `video`, `speech` (media generation) are stored for later and unused yet. Settings offers each only the models whose `modelType` is the matching kind.
      properties:
        provider: { type: string }
        model: { type: string }
      additionalProperties: false

    SettingPatch:
      type: object
      required: [values]
      properties:
        values:
          type: object
          minProperties: 1
          description: Leaves to set, keyed by dotted path inside the projected settings document (e.g. `conversation.max_turn_steps`, `server.hosts`, `models.chat.agent`). Sections and non-projected leaves like `storage.dir` are rejected. Each value is a JSON literal — `null` is refused; its JSON type must match the schema leaf.
          additionalProperties:
            type: [string, number, boolean, object, array]
      additionalProperties: false

    Tool:
      type: object
      required: [name, enabled, permission]
      properties:
        name: { type: string, example: "read_file" }
        description: { type: string }
        parameters:
          type: object
          description: JSON Schema for the call input, as offered to the model. May be redacted for tools unsafe to expose.
        enabled: { type: boolean }
        permission:
          type: string
          enum: [system, agent, general]
          description: Who may invoke the tool — `system` tools are never offered to the model.
      additionalProperties: false

    Update:
      type: object
      required: [current, enabled, installable, latest, available, releaseUrl, notes, installCommand, error]
      properties:
        current: { type: string, example: "0.10.3" }
        enabled: { type: boolean, description: "False for dev builds, which never check for releases." }
        installable: { type: boolean, description: "True when this build can install the release in place." }
        latest: { type: string, description: "Newest release version; empty before a successful lookup." }
        available: { type: boolean, description: "True when `latest` is newer than `current`." }
        publishedAt: { type: [string, "null"], format: date-time }
        releaseUrl: { type: string }
        notes: { type: string, description: "The published release notes." }
        installCommand: { type: string, description: "The terminal command that installs the latest release." }
        checkedAt: { type: [string, "null"], format: date-time, description: "When the last lookup ran; null until one has." }
        error: { type: string, description: "The last lookup's failure; empty when it succeeded." }
      additionalProperties: false

    UpdateProgress:
      type: object
      required: [state, phase, version, bytesDone, bytesTotal, restart, error]
      properties:
        state: { type: string, enum: [idle, running, succeeded, failed] }
        phase: { type: string, enum: [download, verify, install, restart, ""], description: "The step the install is on; empty before it starts." }
        version: { type: string }
        bytesDone: { type: integer, minimum: 0 }
        bytesTotal: { type: integer, minimum: 0 }
        restart: { type: string, enum: [service, process, ""], description: "`service`: the service manager restarts the WebUI. `process`: a foreground run replaces itself." }
        error: { type: string, description: "Why the install failed; empty otherwise." }
      additionalProperties: false

    Project:
      type: object
      required: [id, name, folders, pinned, threads, createdAt, updatedAt]
      properties:
        id: { type: string, example: "p_ITVTPFHGKREMTNTBZ76CAX34BV" }
        name: { type: string }
        folders: { type: array, items: { type: string }, description: Absolute folders; the first is the primary. }
        pinned: { type: boolean }
        threads: { type: integer, minimum: 0, description: Threads in the project; filled by the list. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: The conflict token of a full edit. }
    ProjectWrite:
      type: object
      properties:
        name: { type: string, description: Defaults to the primary folder's name. }
        folders: { type: array, items: { type: string } }
        pinned: { type: boolean }
      additionalProperties: false
    ProjectUpdate:
      type: object
      required: [updatedAt]
      properties:
        name: { type: string }
        folders: { type: array, items: { type: string } }
        pinned: { type: boolean }
        updatedAt: { type: string, format: date-time, description: "The `updatedAt` of the project the edit started from." }
      additionalProperties: false

    Agent:
      type: object
      required: [id, name, command, args, env, policy, autoStart, defaults]
      properties:
        id: { type: string }
        name: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: array
          description: Launch variables by name; the value is never shown.
          items:
            type: object
            required: [name, ref]
            properties:
              name: { type: string }
              ref: { type: string, description: "How the value is held: `env:NAME` or `secret:<key>`.", example: "secret:agent/codex/OPENAI_API_KEY" }
        policy: { $ref: "#/components/schemas/ApprovalPolicy" }
        autoStart: { type: boolean, description: "The agent's process starts with the server and is never stopped for being idle. Otherwise it stops after a few minutes without a turn and the next message starts it again." }
        defaults:
          type: object
          additionalProperties: { type: string }
          description: "Session options (by option id, as `GET /api/agents/{id}/options` lists them) that threads of this agent start with; a thread's own pick overrides them."
    ApprovalPolicy:
      type: string
      enum: [ask, auto_safe, auto_all]
      description: "`ask` asks the owner for every permission request, `auto_safe` allows side-effect-free actions and asks for the rest, `auto_all` allows every request."
    AgentWrite:
      type: object
      required: [command]
      properties:
        name: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string }, description: "Name to literal secret, or to a stored reference to keep." }
        policy: { $ref: "#/components/schemas/ApprovalPolicy" }
        autoStart: { type: boolean, description: "Keep the agent's process running." }
        defaults:
          type: object
          additionalProperties: { type: string }
          description: "Default session options by option id. When the agent is already stored, each is checked against the options the agent offers (which starts it): an unknown option or a value it does not offer is a 400. Replaces the stored defaults."
      additionalProperties: false
    AgentCandidate:
      type: object
      required: [id, name, command, args, registered]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        registered: { type: boolean, description: An agent with this id is already configured. }
    AgentModel:
      type: object
      required: [id, name, current]
      properties:
        id: { type: string }
        name: { type: string }
        current: { type: boolean }
    AgentStatus:
      type: object
      required: [state, logs, authMethods]
      properties:
        state: { type: string, enum: [stopped, running, error] }
        pid: { type: integer }
        uptimeMs: { type: integer, format: int64 }
        lastError: { type: string }
        logs: { type: array, items: { type: string }, description: Recent stderr lines. }
        authMethods:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              type: { type: string }
              command: { type: array, items: { type: string } }
        authNeeded: { type: boolean }
        canLogout: { type: boolean }

    AutomationChat:
      type: object
      required: [channel, chatId]
      properties:
        channel: { type: string, example: "whatsapp" }
        chatId: { type: string }
        thread: { type: string, description: "A thread within the chat, where the channel has them." }
    Automation:
      type: object
      required: [id, name, prompt, schedule, timezone, thread, enabled, expired, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        prompt: { type: string }
        agentId: { type: string, description: The agent that runs it; empty when a provider model does. }
        providerId: { type: string }
        modelId: { type: string }
        schedule: { type: string, enum: [once, cron] }
        runAt: { type: string, format: date-time, description: "When a `once` schedule fires." }
        cron: { type: string, description: "Five-field cron expression of a `cron` schedule." }
        timezone: { type: string, description: IANA zone the schedule is read in. }
        thread: { type: string, enum: [new, same], description: "`new` starts a thread per run; `same` keeps one." }
        conversationId: { type: string, description: "The kept thread of a `same` automation." }
        projectId: { type: string }
        notify: { $ref: "#/components/schemas/AutomationChat" }
        expiresAt: { type: string, format: date-time }
        enabled: { type: boolean }
        expired: { type: boolean }
        nextRunAt: { type: string, format: date-time }
        lastRun: { $ref: "#/components/schemas/AutomationRun" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Changes only on owner edits; the edit form's conflict token. }
    AutomationWrite:
      type: object
      required: [name, prompt, schedule]
      properties:
        name: { type: string }
        prompt: { type: string }
        agentId: { type: string }
        providerId: { type: string }
        modelId: { type: string }
        schedule: { type: string, enum: [once, cron] }
        runAt: { type: string, format: date-time }
        cron: { type: string }
        timezone: { type: string, description: Defaults to the server's. }
        thread: { type: string, enum: [new, same], default: new }
        projectId: { type: string }
        notify: { $ref: "#/components/schemas/AutomationChat" }
        expiresAt: { type: string, format: date-time }
        enabled: { type: boolean, default: true }
      additionalProperties: false
    AutomationUpdate:
      allOf:
        - $ref: "#/components/schemas/AutomationWrite"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time, description: "The `updatedAt` of the automation the edit started from." }
    AutomationRun:
      type: object
      required: [id, scheduledAt, startedAt, status]
      properties:
        id: { type: string }
        scheduledAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        conversationId: { type: string, description: The thread the run used. }
        status: { type: string, enum: [running, completed, failed, cancelled, interrupted], description: "`interrupted` marks a run the server stopped in the middle of." }
        note: { type: string }

    ChannelStatus:
      type: object
      required: [name, label, enabled, connected, state, blocked, updatedAt]
      properties:
        name: { type: string, example: "whatsapp" }
        label: { type: string, example: "WhatsApp" }
        enabled: { type: boolean }
        connected: { type: boolean }
        state: { type: string, description: "The channel's own word: unpaired, pairing, connecting, connected, disconnected, error." }
        detail: { type: string }
        account: { type: string }
        hasQr: { type: boolean, description: "A pairing QR is waiting at `GET /api/channels/{channel}/qr`." }
        blocked:
          type: array
          description: Senders refused by the allowlists, so they can be let in.
          items:
            type: object
            required: [senderId, chatId, at]
            properties:
              senderId: { type: string }
              chatId: { type: string }
              name: { type: string }
              group: { type: boolean }
              at: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [chat, id, sender, at, fromMe, group, text]
      properties:
        chat: { type: string }
        chatName: { type: string }
        id: { type: string }
        sender: { type: string }
        senderName: { type: string }
        at: { type: string, format: date-time }
        fromMe: { type: boolean }
        group: { type: boolean }
        text: { type: string }
        receipt: { type: string, enum: [delivered, read], description: How far the chat confirmed a sent message; absent until it did. }
        explicit: { type: boolean, description: Sent through the send API rather than as a reply. }
        raw: { type: object, additionalProperties: true, description: "The channel's own payload; only with `raw=1`." }
    ChatLink:
      type: object
      required: [channel, chatId, key, display, group, since]
      properties:
        channel: { type: string }
        chatId: { type: string }
        thread: { type: string }
        key: { type: string, description: "What `DELETE /api/conversations/{conversationId}/links` takes as `chat`." }
        display: { type: string }
        group: { type: boolean }
        since: { type: string, format: date-time }

    McpPair:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
    McpServer:
      type: object
      required: [id, name, transport, enabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string, enum: [stdio, http, sse] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: array, items: { type: string }, description: Variable names only. }
        url: { type: string }
        headers: { type: array, items: { type: string }, description: Header names only. }
        enabled: { type: boolean }
        status:
          type: object
          description: The model runtime's connection to the server; absent while disabled.
          required: [connected, tools]
          properties:
            connected: { type: boolean }
            tools: { type: integer }
            error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    McpServerWrite:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http, sse] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: array, items: { $ref: "#/components/schemas/McpPair" } }
        url: { type: string }
        headers: { type: array, items: { $ref: "#/components/schemas/McpPair" } }
        enabled: { type: boolean, default: true }
    McpServerUpdate:
      allOf:
        - $ref: "#/components/schemas/McpServerWrite"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }

    Approval:
      type: object
      required: [id, title, action, options]
      properties:
        id: { type: string }
        callId: { type: string, description: The tool call the request belongs to. }
        title: { type: string }
        input: { type: string }
        action: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, name, choice]
            properties:
              id: { type: string }
              name: { type: string }
              choice: { type: string, enum: [allow_once, allow_always, reject_once, reject_always] }
    Elicitation:
      type: object
      required: [id, mode]
      properties:
        id: { type: string }
        mode: { type: string, enum: [form, url] }
        message: { type: string }
        schema: { type: object, additionalProperties: true, description: "The form's JSON Schema; only for `form`." }
        url: { type: string, description: "The address to visit; only for `url`." }
        expiresAt: { type: string, format: date-time, description: "When the request resolves itself: past this moment the agent receives `cancel` and the transcript records the request as expired, never as the owner's refusal. Absent when the request has no deadline." }
    AgentOption:
      type: object
      required: [id, name, type, current]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        type: { type: string, enum: [select, boolean] }
        current: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [value, name]
            properties:
              value: { type: string }
              name: { type: string }
              description: { type: string }
    OptionsSource:
      type: string
      enum: [session, catalog, agent-default]
      description: |
        Where the offered list came from. `session` is the room's live agent
        session and is the only source a client may present as the options in
        force now. `catalog` is the stored list a real session last reported,
        and `agent-default` is the agent's probe/default answer; both are
        fallback evidence for an idle room and must be labelled as such rather
        than as the live session's options.
    OptionsStatus:
      type: string
      enum: [ready, empty]
      description: |
        What the offered list means. `ready` is the definitive answer — from
        the live session, the stored catalog, or the probe session — and an
        empty list then means the agent offers no session options; a client
        may say so. `empty` is transient: the agent reports nothing right
        now (a live session warming up or one that just retracted its
        options), so a client must treat the list as able to change and
        offer a refresh — never write a permanent "this agent has no
        options" line. `unavailable` is never a wire value: a failure
        answers as the HTTP error response with its message.
    Pending:
      type: object
      description: |
        A pick the room has taken but not applied yet: a turn fixes its
        runtime and session options when it starts, so the pick waits for the
        next one. Detail and list projections include it — and the
        agent-options `202` answers with it — so a client renders the same
        "applies to the next turn" line before and after a reload. It is never
        a claim that the pick is applied.
      required: [acceptedAt]
      properties:
        agentId: { type: string, description: The bound agent, when the pick is an agent room's. }
        modelId: { type: string, description: "The model either runtime picks: the agent-reported model beside `agentId`, the catalog entry beside `providerId`." }
        providerId: { type: string, description: The provider, when the pick is a provider room's. }
        effort: { type: string, description: The reasoning effort picked. }
        upstream: { type: string, description: The aggregator backend picked. }
        options:
          type: array
          description: Session-option picks waiting to apply, sorted by id — a map would reorder between reads and the surface showing it must not flicker.
          items:
            type: object
            required: [id, value]
            properties:
              id: { type: string }
              value: { type: string }
            additionalProperties: false
        acceptedAt: { type: string, format: date-time, description: When the pick was parked. Always present; every other field is omitted when the pick does not carry it. }
      additionalProperties: false
    Command:
      type: object
      required: [name, source, enabled]
      properties:
        name: { type: string, description: "The command's name, reserved on a draft's first line." }
        description: { type: string }
        hint: { type: string, description: Placeholder for the command's input. }
        source: { type: string, enum: [native, agent], description: Who owns the row; a native name wins a collision. }
        enabled: { type: boolean, description: This room's verdict — a refused row stays visible with its reason. }
        reason: { type: string, description: Why the row is off; empty when it is on. }
    ApprovalRule:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        createdAt: { type: string, format: date-time }

    Upload:
      type: object
      required: [id, name, mediaType, size]
      properties:
        id: { type: string }
        name: { type: string }
        mediaType: { type: string }
        size: { type: integer }
    ReferenceCandidate:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [file, folder, skill, mcp] }
        id: { type: string }
        name: { type: string }
        detail: { type: string, description: "For a file or folder, its path in the workspace." }

    BrowserStatus:
      type: object
      required: [open]
      properties:
        open: { type: boolean }
        page:
          type: object
          properties:
            url: { type: string }
            title: { type: string }
            width: { type: integer }
            height: { type: integer }
        device:
          type: object
          description: What the tab pretends to be.
          properties:
            preset: { type: string, enum: [responsive, desktop, mobile, tablet, custom] }
            width: { type: integer }
            height: { type: integer }
            dpr: { type: number }
            mobile: { type: boolean }
            touch: { type: boolean }
            userAgent: { type: string, description: Empty is the real one. }
        lease:
          type: object
          description: Who drives the tab's input. The agent always can; a viewer can once they took over, unless the agent locked input.
          properties:
            controller: { type: string, description: The viewer that took over. }
            agentLock: { type: boolean }
        profile: { type: string }
    BrowserLogin:
      type: object
      required: [id, profile, origin, username, updatedAt]
      properties:
        id: { type: string }
        profile: { type: string }
        origin: { type: string }
        username: { type: string }
        updatedAt: { type: string }
    BrowserInstallOffer:
      type: object
      required: [missing, platform, methods]
      properties:
        missing: { type: boolean }
        execPath: { type: string }
        searched: { type: string }
        platform: { type: string }
        proot: { type: boolean, description: The browser runs without its sandbox here. }
        methods:
          type: array
          description: Most preferred first.
          items:
            type: object
            required: [id, label, detail]
            properties:
              id: { type: string, description: "What `POST /api/browser/install` takes as `method`." }
              label: { type: string }
              detail: { type: string, description: "The exact download or command, shown before anything runs." }
              needsRoot: { type: boolean }
    Recording:
      type: object
      required: [id, sessionId, conversationId, profile, status, createdAt, startedAt, lastSeq, counts]
      properties:
        id: { type: string }
        sessionId: { type: string }
        conversationId: { type: string }
        profile: { type: string }
        status: { type: string }
        env: { type: string }
        createdAt: { type: integer, format: int64, description: Unix milliseconds. }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64 }
        lastSeq: { type: integer, format: int64 }
        counts:
          type: object
          properties:
            events: { type: integer, format: int64 }
            annotations: { type: integer, format: int64 }
            errors: { type: integer, format: int64 }
        interruptedReason: { type: string }
        truncated: { type: boolean }
    RecordingEvent:
      type: object
      required: [seq, ts, origin, type]
      properties:
        seq: { type: integer, format: int64 }
        ts: { type: integer, format: int64, description: Unix milliseconds. }
        origin: { type: string }
        type: { type: string }
        data: { description: The event's own payload. }

  responses:
    BadRequest:
      description: Invalid request — malformed id, out-of-range parameter, unknown enum, unknown setting leaf, or a rejected `null`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:invalid_argument"
            title: "Invalid Argument"
            status: 400
            code: "invalid_argument"
            detail: "limit must be between 1 and 100"
    Conflict:
      description: The resource changed since the version the request was based on, or the action conflicts with its current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:conflict"
            title: "Conflict"
            status: 409
            code: "conflict"
            detail: "the project was changed since you opened it"
    ForbiddenOrigin:
      description: '`Host` is not in server.hosts, or `Origin` is absent/mismatched on an unsafe request.'
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:forbidden_origin"
            title: "Forbidden"
            status: 403
            code: "forbidden_origin"
            detail: "Origin does not match the server origin"
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:not_found"
            title: "Not Found"
            status: 404
            code: "not_found"
            detail: "conversation not found"
    Interrupted:
      description: The request was canceled — client disconnect where the operation is cancelable, or a shutdown race.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:interrupted"
            title: "Interrupted"
            status: 408
            code: "interrupted"
            detail: "request canceled"
    Gone:
      description: The job was queued on a conversation that was deleted underneath it.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:gone"
            title: "Gone"
            status: 410
            code: "gone"
            detail: "conversation deleted"
    InputTooLarge:
      description: The request payload exceeds the server's input bound.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:input_too_large"
            title: "Payload Too Large"
            status: 413
            code: "input_too_large"
            detail: "request body exceeds the input limit"
    QueueFull:
      description: The room's job mailbox is full — retry after the running job finishes.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:queue_full"
            title: "Too Many Requests"
            status: 429
            code: "queue_full"
            detail: "conversation queue full"
    Internal:
      description: Engine or deployment fault — missing adapter, persistence failure, tool loop limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:internal"
            title: "Internal Error"
            status: 500
            code: "internal"
            detail: "job failed"
    UpstreamError:
      description: The provider call failed at the wire — including dead credentials (upstream 401/403) and truncated streams. Detail is display-safe.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:upstream_error"
            title: "Bad Gateway"
            status: 502
            code: "upstream_error"
            detail: "provider rejected the request (HTTP 502)"
    Unavailable:
      description: The application is shutting down.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:unavailable"
            title: "Service Unavailable"
            status: 503
            code: "unavailable"
            detail: "conversation application is shutting down"
    UpstreamTimeout:
      description: The provider did not answer inside its deadline.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:nusashell:problem:upstream_timeout"
            title: "Gateway Timeout"
            status: 504
            code: "upstream_timeout"
            detail: "upstream did not respond in time"
